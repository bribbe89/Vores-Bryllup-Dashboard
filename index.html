/* Draws the plan to scale. The room is turned 90 degrees when that fills the page better, but all text is
   placed in page coordinates, so it always reads left to right (names slant up or down, never upside down). */
function buildPlanPdf(o){
  const w=W()||{},all=docs('tables').sort(tblSort),r=roomOf();
  const Wc=Math.round(r.w*100),Hc=Math.round(r.h*100);
  const land=o.orient==='landscape',pp=PAPER_MM[o.size]||PAPER_MM.a4;
  const pw=land?pp[1]:pp[0],ph=land?pp[0]:pp[1];
  const D=MiniPdf(pw,ph);
  const rot=o.auto&&((Wc>=Hc)!==land)?90:0;
  const RW=rot?Hc:Wc,RH=rot?Wc:Hc;
  const k=Math.min(pw,ph)/210;
  const mg=8*k,headH=14*k,footH=9*k,pad=8*k;
  const ax=mg+pad,ay=mg+headH+pad,aw=pw-2*mg-2*pad,ah=ph-2*mg-headH-footH-2*pad;
  const s=Math.min(aw/RW,ah/RH),ox=ax+(aw-RW*s)/2,oy=ay+(ah-RH*s)/2;
  const mapP=(x,y)=>rot?[Hc-y,x]:[x,y],mapV=(x,y)=>rot?[-y,x]:[x,y];
  const mm=p=>[ox+p[0]*s,oy+p[1]*s];

  D.fill(30,30,30);D.text(pdfStr('Bordplan · '+(w.names||'')),mg,mg+7*k,{size:18*k,bold:true});
  D.fill(90,90,90);D.text(pdfStr([fdate(w.date),w.place].filter(Boolean).join(' · ')),mg,mg+12.5*k,{size:10*k});

  D.lw(0.5*k);D.stroke(40,40,40);D.rect(ox,oy,RW*s,RH*s,'S');

  const names=[];
  all.forEach(t=>{
    const d=tblDims(t),isT=isTable(t);
    const c=mm(mapP(Math.min(Wc,Math.max(0,N(t.x,Wc/2))),Math.min(Hc,Math.max(0,N(t.y,Hc/2)))));
    const u=unitsOf(t),seen=new Set();
    seatPoints(t).forEach((p,i)=>{
      const e=u[i],nv=mapV(p[2],p[3]),cv=mapV(p[0],p[1]),tv=[-nv[1],nv[0]];
      const cc=[c[0]+cv[0]*s,c[1]+cv[1]*s];
      const at=(a,b)=>[cc[0]+(tv[0]*a+nv[0]*b)*s,cc[1]+(tv[1]*a+nv[1]*b)*s];
      const st=entryStatus(e);
      if(e){const g=st==='nej'?[160,43,43]:[122,43,78];D.fill(g[0],g[1],g[2]);D.stroke(g[0],g[1],g[2])}
      else{D.fill(255,255,255);D.stroke(90,90,90)}
      D.lw(0.25*k);
      D.path([at(-22,-13),at(22,-13),at(22,13),at(-22,13)],'FD');
      if(e&&!seen.has(e.id)){
        seen.add(e.id);
        const right=nv[0]>=0,down=nv[1]>0,ang=(right?1:-1)*35*(down?1:-1),n=Math.max(1,Math.round(N(e.n,1)));
        names.push({x:cc[0]+nv[0]*20*s,y:cc[1]+nv[1]*20*s,ang,right,text:pdfStr(shortName(e.name))+(n>1?' ('+n+')':''),decl:st==='nej'});
      }
    });
    if(isT){D.fill(232,238,230);D.stroke(40,40,40)}else{D.fill(255,255,255);D.stroke(0,0,0)}
    D.lw(0.35*k);
    if(t.shape==='round')D.circle(c[0],c[1],d.w/2*s,'FD');
    else D.path(polyOf(t).map(q=>{const v=mapV(q[0],q[1]);return[c[0]+v[0]*s,c[1]+v[1]*s]}),'FD');
    /* text inside the element, always upright */
    const round=t.shape==='round',bwP=(round?d.w:(rot?d.h:d.w))*s,bhP=(round?d.w:(rot?d.w:d.h))*s;
    const f=(t.shape==='rhombus'||t.shape==='triangle')?0.5:(round?0.78:0.9);
    D.fill(25,25,25);
    if(isT){
      const lb=pdfStr('Bord '+t.no);
      let pt=Math.min(16*k,bhP*0.2/PT);
      const wd=D.width(lb,pt,true);if(wd>bwP*f)pt=Math.max(4,pt*bwP*f/wd);
      D.text(lb,c[0],c[1]-pt*PT*0.35,{size:pt,bold:true,align:'center',mid:true});
      D.fill(90,90,90);
      D.text(usedOf(t)+'/'+capOf(t),c[0],c[1]+pt*PT*0.75,{size:pt*0.7,align:'center',mid:true});
    }else{
      const lb=pdfStr(tName(t));
      let pt=Math.min(18*k,bhP*0.4/PT);
      const wd=D.width(lb,pt,true);
      if(wd>bwP*f&&bhP>bwP*1.4&&pt*bwP*f/wd<6*k){
        /* tall and narrow: read bottom to top along the long side */
        let pv=Math.min(18*k,bwP*0.4/PT);
        const wv=D.width(lb,pv,true);if(wv>bhP*0.9)pv=Math.max(4,pv*bhP*0.9/wv);
        D.text(lb,c[0],c[1],{size:pv,bold:true,angle:-90,align:'center',mid:true});
      }else{
        if(wd>bwP*f)pt=Math.max(4,pt*bwP*f/wd);
        D.text(lb,c[0],c[1],{size:pt,bold:true,align:'center',mid:true});
      }
    }
  });

  /* names last, so they lie on top of everything */
  names.forEach(L=>{
    const pt=Math.max(5,Math.min(13*k,44*s*0.34/PT));
    if(L.decl)D.fill(160,43,43);else D.fill(25,25,25);
    D.text(L.text,L.x,L.y,{size:pt,bold:L.decl,angle:L.ang,align:L.right?'left':'right',mid:true});
  });

  const denom=Math.max(1,Math.round(10/s/5)*5);
  D.fill(90,90,90);
  D.text(pdfStr('Salens mål '+comma(r.w)+' × '+comma(r.h)+' m · Målestok ca. 1:'+denom+' ved udskrift i faktisk størrelse · Rød = har meldt afbud'),mg,ph-mg,{size:8*k});
  return D.blob();
}

/* ================= rich text (bold, italic, underline) ================= */
const RT_ALLOWED={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',BR:'br',DIV:'div',P:'div'};
/* keeps only b, i, u, br and div; everything else is flattened to its text */
function cleanRich(html){
  const t=document.createElement('template');t.innerHTML=String(html||'');
  const walk=(node,out)=>{
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){out.appendChild(document.createTextNode(n.nodeValue));return}
      if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
      const m=RT_ALLOWED[n.tagName];
      if(m){const el=document.createElement(m);if(m!=='br')walk(n,el);out.appendChild(el)}else walk(n,out);
    });
  };
  const box=document.createElement('div');walk(t.content,box);
  return box.innerHTML.replace(/(<div><br><\/div>|<br>)+$/,'').trim();
}
function richHtml(s){s=String(s||'');return/<(b|i|u|br|div|p|strong|em)\b/i.test(s)?cleanRich(s):E(s).replace(/\n/g,'<br>')}

/* ================= drag to reorder (menu, budget) ================= */
const RD={};
async function saveOrder(list,refOf){for(let i=0;i<list.length;i++){if(list[i].order!==i+1)await refOf(list[i].id).update({order:i+1})}}
const rdKey=v=>String(v||'').split('|')[0];
function rdClear(){document.querySelectorAll('.rd-before,.rd-after').forEach(n=>n.classList.remove('rd-before','rd-after'))}
document.addEventListener('dragstart',e=>{
  const g=e.target.closest&&e.target.closest('[data-rdrag]');if(!g)return;
  e.dataTransfer.setData('text/plain','rd:'+g.dataset.rdrag);e.dataTransfer.effectAllowed='move';
  const box=g.closest('tr,article');if(box&&e.dataTransfer.setDragImage)e.dataTransfer.setDragImage(box,12,12);
  S.ui.rdrag=g.dataset.rdrag;
});
document.addEventListener('dragend',()=>{S.ui.rdrag=null;rdClear()});
document.addEventListener('dragover',e=>{
  const z=e.target.closest&&e.target.closest('[data-rdrop]');
  if(!z||!S.ui.rdrag||rdKey(z.dataset.rdrop)!==rdKey(S.ui.rdrag))return;
  e.preventDefault();
  const r=z.getBoundingClientRect(),before=e.clientY<r.top+r.height/2;
  rdClear();z.classList.add(before?'rd-before':'rd-after');
});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('[data-rdrop]');if(!z)return;
  const raw=e.dataTransfer.getData('text/plain')||'';if(raw.indexOf('rd:')!==0)return;
  e.preventDefault();
  const r=z.getBoundingClientRect(),before=e.clientY<r.top+r.height/2;
  const a=raw.slice(3).split('|'),b=z.dataset.rdrop.split('|');
  rdClear();S.ui.rdrag=null;
  if(a[0]!==b[0]||!RD[a[0]])return;
  go(()=>RD[a[0]](a[1],b[1],before));
});

const mkRD=(col)=>async(did,tid,before)=>{
  const all=docs(col).sort((a,b)=>(a.order||0)-(b.order||0)||(a.at||0)-(b.at||0)),d=all.find(x=>x.id===did);if(!d)return;
  const list=all.filter(x=>x.id!==did),i=list.findIndex(x=>x.id===tid);if(i<0)return;
  list.splice(before?i:i+1,0,d);
  await saveOrder(list,id=>S.db.doc(PUB(col+'/'+id)));
};
RD.menu=mkRD('menu');RD.sp=mkRD('speeches');
A.rdMove=async el=>{
  if(el.dataset.k!=='menu')return;
  const list=docs('menu').sort(byOrder),i=list.findIndex(x=>x.id===el.dataset.id),dir=parseInt(el.dataset.dir,10),t=list[i+dir];
  if(i<0||!t)return;
  await RD.menu(el.dataset.id,t.id,dir<0);
};
const bKind=r=>r&&r.kind==='indtaegt'?'indtaegt':'udgift';
RD.b=async(did,tid,before)=>{
  const rows=docs('budget'),byId=id=>rows.find(r=>r.id===id),d=byId(did);let t=byId(tid);
  if(!d||!t||d.id===t.id)return;
  if(d.t==='h'){
    if(t.t!=='h')t=byId(t.parent);
    if(!t||t.id===d.id)return;
    const heads=rows.filter(r=>r.t==='h'&&r.id!==d.id).sort(byOrder),i=heads.findIndex(x=>x.id===t.id);
    heads.splice(before?i:i+1,0,d);
    if(bKind(t)!==bKind(d)){const k=bKind(t);await bref(d.id).update({kind:k});for(const c of rows.filter(r=>r.parent===d.id))await bref(c.id).update({kind:k})}
    await saveOrder(heads,bref);return;
  }
  let parent,kind,sibs;
  if(t.t==='h'){
    parent=t.id;kind=bKind(t);
    sibs=rows.filter(r=>r.t!=='h'&&r.parent===parent&&r.id!==d.id).sort(byOrder);
    sibs.splice(before?0:sibs.length,0,d);
  }else{
    parent=t.parent||'';const sec=parent&&byId(parent);kind=sec?bKind(sec):bKind(t);
    sibs=rows.filter(r=>r.t!=='h'&&(r.parent||'')===parent&&r.id!==d.id).sort(byOrder);
    const i=sibs.findIndex(x=>x.id===t.id);sibs.splice(before?i:i+1,0,d);
  }
  if((d.parent||'')!==parent||d.kind!==kind)await bref(d.id).update({parent,kind});
  await saveOrder(sibs,bref);
};

}
function uploadBox(){
  return S.assets?'<label class="btn primary" style="cursor:pointer">'+ico('upload','s')+' Upload billeder<input type="file" accept="image/*" multiple data-c="galUp" style="position:absolute;opacity:0;width:1px;height:1px"></label>':'<span class="hint">Upload er ikke tilgængelig for dig i denne visning.</span>';
}
function galleryView(w){
  const list=docs('gallery').sort((a,b)=>(b.at||0)-(a.at||0)),tok=w.tokens&&w.tokens.gallery;
  return contactStrip(w,'gallery')+'<div class="bar"><h2>Galleri</h2><div class="row">'+uploadBox()+(list.length?'<button class="btn" data-a="galDlAll">'+ico('dl','s')+' Hent alle ('+list.length+')</button>':'')+'</div></div>'+linkBox('Link til gæster og fotograf (upload)',tok)+galleryGrid(list,w);
}
C.galUp=async el=>{
  const files=Array.from(el.files||[]).filter(f=>/^image\//.test(f.type));
  if(!files.length){toast('Vælg billedfiler.');return}
  toast('Uploader '+files.length+(files.length===1?' billede…':' billeder…'));
  const up=await uploadFiles(files);
  for(const f of up)await S.db.doc('pub/'+S.wid+'/gallery/'+rid()).set({assetId:f.id,name:f.name,type:f.type,by:S.me.name||'Gæst',uid:S.me.id||'',at:Date.now()});
  if(up.length)toast(up.length+(up.length===1?' billede er uploadet.':' billeder er uploadet.'));
  el.value='';
};
async function fetchPhoto(g){const r=await fetch(blobUrl(g.assetId));if(!r.ok)throw new Error('http');return r.blob()}
A.galDl=async el=>{
  const g=(S.d.gallery||{})[el.dataset.id];if(!g)return;
  try{const b=await fetchPhoto(g);await saveFile(fileName(g),b)}
  catch(e){toast('Billedet kunne ikke hentes direkte. Åbn det ved at trykke på det, og gem det derfra.')}
};
A.galDlAll=async el=>{
  const list=docs('gallery').sort((a,b)=>(a.at||0)-(b.at||0));
  if(!list.length)return;
  if(typeof JSZip==='undefined'){toast('Zip-biblioteket kunne ikke hentes.');return}
  const z=new JSZip(),used=new Set();let n=0;
  toast('Samler '+list.length+' billeder…');
  for(let i=0;i<list.length;i++){
    try{
      const b=await fetchPhoto(list[i]);let nm=fileName(list[i],i);
      while(used.has(nm))nm=nm.replace(/(\.[A-Za-z0-9]+)$/,'-'+(i+1)+'$1');
      used.add(nm);z.file(nm,b);n++;
    }catch(e){}
  }
  if(!n){toast('Billederne kunne ikke hentes direkte. Åbn dem enkeltvis og gem dem.');return}
  const blob=await z.generateAsync({type:'blob'});
  if(await saveFile('billeder-'+(S.weddings[S.wid]?String(S.weddings[S.wid].date||''):'bryllup')+'.zip',blob))toast(n+' billeder er gemt.'+(n<list.length?' '+(list.length-n)+' kunne ikke hentes.':''));
};
A.galDel=el=>confirmThen('p'+el.dataset.id,async()=>{
  const id=el.dataset.id,g=(S.d.gallery||{})[id];if(!g)return;
  await S.db.doc('pub/'+S.wid+'/gallery/'+id).delete();
  if(S.assets&&g.assetId)S.assets.delete(g.assetId).catch(()=>{});
});

/* ================= guest-facing pages ================= */
function guestView(){
  const g=S.guest;let body='';
  if(g.type==='rsvp')body=rsvpPage(g);
  else if(g.type==='toast')body='<div>'+polterPage(S.d.toast,S.d.info,'toast','Toastmaster')+'</div>';
  else if(g.type==='polter')body='<div>'+polterPage(S.d.polter,S.d.info)+'</div>';
  else if(g.type==='gallery'){
    const list=docs('gallery').sort((a,b)=>(b.at||0)-(a.at||0));
    body='<p class="chip acc">Billeder</p><h1 style="margin-top:8px">'+E(g.names||'Bryllup')+'</h1><p class="lead">'+E(fdate(g.date))+'. Del dine billeder med brudeparret, og se de andres.</p><div class="row" style="margin:16px 0">'+uploadBox()+'</div>'+galleryGrid(list,S.weddings[g.wid]);
  }
  const back=(S.me.isAdmin||S.weddings[g.wid])?'<div style="padding-top:14px"><button class="btn sm ghost" data-a="leaveGuest">'+ico('left','s')+' Til platformen</button></div>':'';
  return topbar()+'<main class="wrap">'+back+'<div class="hero">'+body+'</div></main>';
}
A.leaveGuest=()=>leaveGuest();
function rsvpPage(g){
  const a=S.d.myAnswer,done=S.ui.rsvpDone,cfg=rcfg();
  const st=a?a.status:'',ad=a?N(a.adults,N(g.adults,1)):N(g.adults,1),ch=a?N(a.children,N(g.children,0)):N(g.children,0);
  if(done&&a)return'<p class="chip ok">Svar modtaget</p><h1 style="margin-top:8px">Tak, '+E(g.name)+'</h1><p class="lead">'+(a.status==='ja'?'Vi glæder os til at se dig til bryllupsfesten den '+E(fdate(g.date))+'.':'Vi er kede af, at du ikke kan være med, men tak fordi du gav besked.')+'</p>'+rsvpConfirmHtml(a)+'<p style="margin-top:16px"><button class="btn" data-a="rsvpChange">Ret mit svar</button></p>';
  return'<p class="chip acc">Svar på invitation</p><h1 style="margin-top:8px">'+E(g.names||'')+'</h1><p class="lead">'+E(fdate(g.date))+(g.place?' · '+E(g.place):'')+'</p>'+
    '<div class="stack" style="margin-top:22px;max-width:520px"><h3>Hej '+E(g.name)+'</h3>'+(cfg.intro?'<p style="white-space:pre-line">'+E(cfg.intro)+'</p>':'')+(a?'<p class="hint">Du har allerede svaret. Du kan rette dit svar herunder.</p>':'')+
    '<label class="chk"><input type="radio" name="rs" value="ja" data-c="rsvpSt"'+(st==='ja'?' checked':'')+'> Ja, jeg kommer</label><label class="chk"><input type="radio" name="rs" value="nej" data-c="rsvpSt"'+(st==='nej'?' checked':'')+'> Nej, jeg kan desværre ikke</label>'+
    '<div class="stack" id="rs-extra"'+(st==='ja'?'':' hidden')+'><div class="grid2" id="rs-counts"><label class="f">Voksne<input id="rs-a" type="number" min="0" max="20" class="in" value="'+ad+'"></label><label class="f">Børn<input id="rs-c" type="number" min="0" max="20" class="in" value="'+ch+'"></label></div>'+
    rsvpExtraHtml(cfg,a)+'</div>'+
    '<div><button class="btn primary" data-a="rsvpSend">Send svar</button></div></div>';
}
C.rsvpSt=el=>{const c=$('#rs-extra');if(c){c.hidden=el.value!=='ja';if(el.value==='ja')rsvpTotal()}};
A.rsvpChange=()=>{S.ui.rsvpDone=false;render()};
A.rsvpSend=async()=>{
  const g=S.guest,sel=document.querySelector('input[name=rs]:checked');
  if(!sel){toast('Vælg først, om du kommer.');return}
  const ja=sel.value==='ja';
  const cfg=rcfg(),ro=ja?rsvpOpts(cfg):{opts:{},total:0},sp=!!(ja&&cfg.speech.on&&chk('rs-sp'));
  const doc={wid:g.wid,gid:g.token,name:g.name,status:sel.value,adults:ja?Math.max(0,Math.round(num(val('rs-a')))):0,children:ja?Math.max(0,Math.round(num(val('rs-c')))):0,note:ja&&cfg.allergy.on?val('rs-note').trim():'',opts:ro.opts,total:ro.total,speechOn:sp,speechText:sp?val('rs-sptx').trim():'',at:Date.now()};
  try{await S.db.doc('rsvp/'+g.token).set(doc)}
  catch(e){
    if(e&&e.code==='invalid_argument'){toast('Dit svar kunne ikke gemmes, fordi du kun har læseadgang til siden. Giv brudeparret besked direkte.');return}
    throw e;
  }
  /* the speech overview for the toastmaster lives in the public area, one document per guest */
  try{
    const sr=S.db.doc('pub/'+g.wid+'/speeches/'+g.token);
    if(sp){
      try{await sr.update({name:g.name,group:g.group||'',text:doc.speechText,at:doc.at})}
      catch(e){await sr.set({gid:g.token,name:g.name,group:g.group||'',text:doc.speechText,at:doc.at,order:Date.now()})}
    }else await sr.delete();
  }catch(e){}
  S.d.myAnswer=doc;S.ui.rsvpDone=true;render();
};

/* ================= keyboard + boot ================= */
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t&&t.matches&&t.matches('[role=button][data-a]')){e.preventDefault();t.click()}
});
async function boot(){
  const cl=window.claude;
  if(!cl||typeof cl.use!=='function'){S.offline=true;doRender();return}
  const use=async n=>{try{return await cl.use(n)}catch(e){return null}};
  S.db=await use('db');S.user=await use('user');S.assets=await use('assets');S.downloads=await use('downloads');
  if(S.user){
    try{const me=await S.user.me();S.me={id:me.id,name:me.name||'',email:me.email,isAdmin:!!me.canEdit,avatar:me.avatarUrl||''}}catch(e){}
  }
  if(!S.db){S.noDb=true;doRender();return}
  await resolveHash();
  S.db.collection('weddings').onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});
    S.weddings=m;S.loaded=true;autoPick();render();
  },e=>{S.loaded=true;S.err.weddings=e&&e.code;render()});
  render();
}
boot();
})();
</script>

</body></html>
