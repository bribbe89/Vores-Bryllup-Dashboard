<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Brudebordet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gloock&display=swap">
<style>
/* Layout: slim top bar, wedding header with countdown, section tabs, then one full-width panel per section; the dashboard is an eight-tile board. */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --ink:#1C2B28; --muted:#5C6A65; --line:#D8DCD1;
  --accent:#7A2B4E; --on-accent:#FFFFFF; --accent-soft:#F3E2E9; --sage:#E3EAE1;
  --ok:#2E6A4E; --ok-soft:#DCEBE2; --warn:#8C5F0E; --warn-soft:#F5E8C9; --bad:#A02B2B; --bad-soft:#F6DCDC;
  --shadow:0 1px 2px rgba(20,30,28,.06),0 8px 22px rgba(20,30,28,.07);
  --f-display:'Gloock',Georgia,'Times New Roman',serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131B19; --surface:#1B2623; --ink:#E5ECE8; --muted:#9AA9A2; --line:#2B3834; --accent:#E39AB7; --on-accent:#2A0F1B; --accent-soft:#3A2230; --sage:#223029;
  --ok:#7CC9A2; --ok-soft:#1E3A2E; --warn:#E0B65C; --warn-soft:#3B3014; --bad:#F09A9A; --bad-soft:#3F2121; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131B19; --surface:#1B2623; --ink:#E5ECE8; --muted:#9AA9A2; --line:#2B3834; --accent:#E39AB7; --on-accent:#2A0F1B; --accent-soft:#3A2230; --sage:#223029;
  --ok:#7CC9A2; --ok-soft:#1E3A2E; --warn:#E0B65C; --warn-soft:#3B3014; --bad:#F09A9A; --bad-soft:#3F2121; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--f-display);text-wrap:balance;line-height:1.15}
h2{font-size:26px} h3{font-size:19px}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto}
.boot{padding:48px 0;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .r{text-align:right} .nowrap{white-space:nowrap}
.hint{font-size:13px;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:22px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who img{width:26px;height:26px;border-radius:50%}

/* wedding header */
.wedhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:26px 0 14px}
.names{font-size:clamp(30px,6vw,52px)}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;color:var(--muted)}
.count{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:2px 10px;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;padding-bottom:0}
.tab{font:inherit;font-weight:600;font-size:14px;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)} .tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

/* buttons & fields */
.btn{font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 10px;font-size:13px} .btn.ghost{background:transparent;border-color:transparent} .btn.ghost:hover{background:var(--sage)}
.btn.danger{color:var(--bad)} .btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.in:focus-visible,.tab:focus-visible,.tile:focus-visible,.brand:focus-visible,.card:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
textarea.in{resize:vertical;min-height:84px}
.in.bare{border-color:transparent;background:transparent;padding:5px 6px} .in.bare:hover{border-color:var(--line)} .in.bare:focus{background:var(--surface)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .in{font-weight:400;color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.lead{color:var(--muted);max-width:62ch;margin-top:6px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sage);color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;font:inherit;color:inherit;min-height:158px;text-decoration:none}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile .ic{width:44px;height:44px;border-radius:12px;background:var(--sage);display:grid;place-items:center;color:var(--accent)}
.tile h3{font-size:20px} .tile .stat{color:var(--muted);font-size:14px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}

/* wedding cards */
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.wcard h3{font-size:26px}

/* tables */
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th.r,.tbl td.r{text-align:right}
.tbl tr.sec td{background:var(--sage);font-weight:700}
.tbl tr.kind td{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;padding-top:18px;border-bottom:2px solid var(--accent)}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.tbl .in.bare.num{text-align:right;width:104px}
.delta{font-size:11.5px;font-weight:700;margin-left:6px}.delta.up{color:var(--bad)}.delta.down{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat-box .k{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.stat-box .v{font-family:var(--f-display);font-size:26px;margin-top:2px}
.stat-box .s{font-size:13px;color:var(--muted)}
.seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sage);margin-top:10px}
.seg i{display:block;height:100%}.seg .a{background:var(--ok)}.seg .b{background:var(--bad)}.seg .c{background:var(--warn)}

/* tasks */
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sage);border-radius:12px;padding:10px;min-height:180px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent)}
.col h3{font-size:17px;display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.card:hover{border-color:var(--accent)} .card .t{font-weight:600} .card.done .t{text-decoration:line-through;color:var(--muted)}
.card .chips{display:flex;gap:6px;flex-wrap:wrap}
.card .mv{display:flex;justify-content:flex-end;gap:2px}

/* calendar */
.calbox{max-height:72vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px}
.month{margin-bottom:26px} .month h3{margin-bottom:8px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.dow{background:var(--sage);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:4px 0;color:var(--muted);font-weight:600}
.day{background:var(--surface);min-height:88px;padding:4px;font-size:12px;cursor:pointer;min-width:0;text-align:left;border:0;font-family:inherit;color:inherit;display:block}
.day:hover{background:var(--accent-soft)} .day.out{background:var(--bg);cursor:default}
.day.today .n{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:0 6px}
.day .n{font-weight:700;display:inline-block}
.ev{display:block;font-size:11.5px;padding:1px 5px;border-radius:4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--sage);color:var(--ink);cursor:pointer;border:0;font-family:inherit;width:100%;text-align:left}
.ev.task{background:var(--accent-soft);color:var(--accent)} .ev.dl{background:var(--warn-soft);color:var(--warn)} .ev.wd{background:var(--accent);color:var(--on-accent);font-weight:700} .ev.done{opacity:.55;text-decoration:line-through}
@media (max-width:560px){.day{min-height:62px}.ev{font-size:0;height:7px;width:7px;border-radius:50%;padding:0;display:inline-block;margin:3px 2px 0 0;width:7px}}
.agenda .it{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.agenda.withprice .it{grid-template-columns:96px 1fr 120px auto}
.agenda .it.head{font-size:12px;font-weight:700;color:var(--muted);padding:6px 0}
.agenda .pr{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.agenda h3{margin:18px 0 4px;text-transform:capitalize}

/* menu / gallery / polter */
.dish{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.dish h3{font-size:24px} .pre{white-space:pre-wrap;overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumbs figure{margin:0;position:relative;border-radius:10px;overflow:hidden;background:var(--sage);aspect-ratio:1/1;max-width:100%}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gal figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.gal .ph{aspect-ratio:4/3;background:var(--sage);display:grid;place-items:center;color:var(--muted);font-size:13px}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{padding:8px 10px;display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12.5px}
.filelist{display:flex;flex-direction:column;gap:6px}
.filelist .fl{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.filelist img{width:38px;height:38px;object-fit:cover;border-radius:6px}
.contactline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--sage);border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.linkbox code{overflow-wrap:anywhere;flex:1;min-width:0;font-size:13px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,4vw,34px);margin-top:26px}
.hero h1{font-size:clamp(28px,5vw,44px)}

/* modal, toast */
.scrim{position:fixed;inset:0;background:rgba(10,18,16,.55);display:grid;place-items:start center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50;overflow:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:580px;width:100%;padding:22px;box-shadow:var(--shadow);margin:auto}
.modal.wide{max-width:860px}
.modal h2{font-size:24px;margin-bottom:14px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.choice{display:flex;flex-direction:column;gap:10px}
.choice .btn{justify-content:flex-start;padding:14px 16px;font-size:15px;text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.dz{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.tbl-small td,.tbl-small th{font-size:13px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.agenda .it{grid-template-columns:70px 1fr}.agenda .it .x{grid-column:2}.agenda.withprice .it{grid-template-columns:70px 1fr auto}.agenda.withprice .it .x{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* seating */
.plan{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.plan .floor{fill:var(--surface);stroke:var(--ink);stroke-width:2px;vector-effect:non-scaling-stroke}
.plan .gl{stroke:var(--line);stroke-width:1px;vector-effect:non-scaling-stroke}
.plan [data-tdrag]{cursor:grab;touch-action:none}
.plan .tb{fill:var(--sage);stroke:var(--ink);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.plan g:hover .tb{fill:var(--accent-soft)}
.plan .ch{fill:var(--surface);stroke:var(--muted);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.plan .ch.on{fill:var(--accent);stroke:var(--accent)}
.plan .ch.no{fill:var(--bad);stroke:var(--bad)}
.plan text{fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none;font-family:var(--f-body);font-weight:600}
.plan text.sub{fill:var(--muted);font-weight:500}
.seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:18px}
.seatrow{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:6px;cursor:grab}
.seatrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.seatrow.nej .nm{color:var(--bad);font-weight:700}
.seatrow.over,.seatcard.over{outline:2px dashed var(--accent);outline-offset:1px}
.sug{border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);margin-top:4px;max-height:260px;overflow:auto}
.sug button{display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;cursor:pointer}
.sug button:last-child{border-bottom:0}
.sug button:hover,.sug button:focus-visible{background:var(--accent-soft)}

.plan{overflow:visible}
.plan text.nm{font-weight:500;fill:var(--ink);stroke:var(--surface);paint-order:stroke;stroke-linejoin:round}
.plan text.nm.no{fill:var(--bad);font-weight:700}
.plan .tb.el{fill:var(--accent-soft);stroke:var(--accent)}
.plan g:hover .tb.el{fill:var(--sage)}

.plan .rotbtn{cursor:pointer}
.plan .rotbtn circle{fill:var(--surface);stroke:var(--accent);stroke-width:1.5px;vector-effect:non-scaling-stroke}
.plan .rotbtn path{fill:none;stroke:var(--accent);stroke-width:1.8px;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.plan .rotbtn:hover circle{fill:var(--accent-soft)}
.seatcard.overfull{background:color-mix(in srgb,var(--bad) 9%,var(--surface));border-color:var(--bad)}
.subrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.subrow:hover{border-color:var(--accent)}
.subrow.done .t{text-decoration:line-through;color:var(--muted)}
.subrow .chips{display:flex;gap:6px;flex-wrap:wrap}
.rsfeat{border:1px solid var(--line);border-radius:12px;padding:10px 14px 6px;margin:0;min-width:0}
.rsfeat legend{font-weight:700;padding:0 6px}
.rsopt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.rsfeat .hint+.rsopt,.rsfeat legend+.rsopt{border-top:0}
.rsq{display:flex;align-items:center;gap:6px}.rsq input{width:72px}
.grip{cursor:grab;color:var(--muted);user-select:none;padding:0 6px 0 0;letter-spacing:-2px;font-weight:700}
.grip:active{cursor:grabbing}
.gripcell{display:flex;align-items:center;gap:2px}
tr.rd-before td{box-shadow:inset 0 3px 0 var(--accent)}
tr.rd-after td{box-shadow:inset 0 -3px 0 var(--accent)}
article.rd-before{box-shadow:0 -3px 0 var(--accent)}
article.rd-after{box-shadow:0 3px 0 var(--accent)}
.rtebar{display:flex;gap:6px;margin:6px 0}
.rte{min-height:96px;display:block;overflow-wrap:anywhere;cursor:text}
.rich{overflow-wrap:anywhere}
.thsort{all:unset;cursor:pointer;font-weight:inherit;white-space:nowrap}
.thsort:hover,.thsort.on{color:var(--accent)}
.thsort:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbl tr.filt th{padding:2px 6px 8px}
.thf{padding:4px 8px;font-size:13px;min-height:0;font-weight:400}

/* "1.500,50" / "1500.5" / "12 000 kr" -> number */
function num(v){
  let s=String(v==null?'':v).trim().replace(/\s|kr\.?/gi,'');
  if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return Number.isFinite(n)?n:0;
}

/* A guest row plus an optional answer sent via the RSVP link. The newer of the two wins. */
function effGuest(g,a){
  const useA=!!(a&&a.at>(g.manualAt||0));
  const s=useA?a:g;
  const status=s.status==='ja'||s.status==='nej'?s.status:'afventer';
  const ia=N(g.adults,1),ic=N(g.children,0);
  let ad=0,ch=0;
  if(status==='ja'){
    ad=useA?N(a.adults,ia):N(g.attAdults,ia);
    ch=useA?N(a.children,ic):N(g.attChildren,ic);
  }
  return{status,adults:ad,children:ch,viaLink:useA,note:useA?(a.note||''):(g.note||''),opts:(useA?a.opts:g.opts)||{},speechOn:!!(useA?a.speechOn:g.speechOn),speechText:(useA?a.speechText:g.speechText)||''};
}

/* Totals for the guest list: invited, and expected after RSVP. */
function summarize(guests,answers,pend){
  const inv={a:0,c:0},rs={a:0,c:0};let ja=0,nej=0,afv=0,jaP=0,sent=0;
  guests.forEach(g=>{
    const ia=N(g.adults,1),ic=N(g.children,0);
    inv.a+=ia;inv.c+=ic;
    if(g.sentAt)sent++;
    const e=effGuest(g,answers&&answers[g.id]);
    if(e.status==='ja'){ja++;jaP+=e.adults+e.children;rs.a+=e.adults;rs.c+=e.children}
    else if(e.status==='nej')nej++;
    else{afv++;if(pend){rs.a+=ia;rs.c+=ic}}
  });
  return{inv,rs,ja,nej,afv,jaP,sent,rows:guests.length,invTotal:inv.a+inv.c,rsTotal:rs.a+rs.c};
}

function qtyOf(r,cnt){
  const m=r.mode||'fixed';
  if(m==='guest')return cnt.a+cnt.c;
  if(m==='adult')return cnt.a;
  if(m==='child')return cnt.c;
  return N(r.qty,1);
}
const amountOf=(r,cnt)=>N(r.price,0)*qtyOf(r,cnt)+N(r.extra,0);

/* rows: [{id,t:'h'|'i',kind:'udgift'|'indtaegt',parent,price,qty,mode,order,...}] */
function budgetCalc(rows,inv,rs){
  const out={sections:[],loose:{udgift:[],indtaegt:[]},tot:{udgift:{o:0,r:0},indtaegt:{o:0,r:0}}};
  const secMap={};
  rows.filter(r=>r.t==='h').sort(byOrder).forEach(s=>{
    const o={s,kind:s.kind==='indtaegt'?'indtaegt':'udgift',items:[],o:0,r:0};
    secMap[s.id]=o;out.sections.push(o);
  });
  rows.filter(r=>r.t!=='h').sort(byOrder).forEach(it=>{
    const o=amountOf(it,inv),hasAct=it.actual!==undefined&&it.actual!==null&&it.actual!=='';
    const r=hasAct?N(it.actual,0):amountOf(it,rs)+(N(it.extraAct,N(it.extra,0))-N(it.extra,0));
    const sec=secMap[it.parent];
    const kind=sec?sec.kind:(it.kind==='indtaegt'?'indtaegt':'udgift');
    const e={it,o,r};
    if(sec){sec.items.push(e);sec.o+=o;sec.r+=r}else out.loose[kind].push(e);
    out.tot[kind].o+=o;out.tot[kind].r+=r;
  });
  out.net={o:out.tot.indtaegt.o-out.tot.udgift.o,r:out.tot.indtaegt.r-out.tot.udgift.r};
  return out;
}

}

function monthGrid(y,m){
  const first=new Date(y,m,1),off=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();

  for(let i=0;i<off;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(ymd(new Date(y,m,d)));
  while(cells.length%7)cells.push(null);
  return cells;
}

/* Seating plan geometry (units: centimetres). Tables: {no,shape,w,h,seats,x,y,ppl:[{id,gid,name,n}]} */
const isTable=t=>!t.kind||t.kind==='table';
const capOf=t=>Math.max(0,Math.round(N(t.seats,0)));
const usedOf=t=>(t.ppl||[]).reduce((a,e)=>a+Math.max(1,Math.round(N(e.n,1))),0);
const unitsOf=t=>{const u=[];(t.ppl||[]).forEach(e=>{const n=Math.max(1,Math.round(N(e.n,1)));for(let i=0;i<n;i++)u.push(e)});return u};
function tblDims(t){const w=N(t.w,120);let h=N(t.h,0);if(t.shape==='round'||!h)h=w;return{w,h}}
function polyOf(t){
  const d=tblDims(t),w=d.w,h=d.h;
  if(t.shape==='rhombus')return[[0,-h/2],[w/2,0],[0,h/2],[-w/2,0]];
  if(t.shape==='triangle')return[[0,-h/2],[w/2,h/2],[-w/2,h/2]];
  return[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]];
}
function seatPoints(t){
  const n=capOf(t),out=[];
  if(!n)return out;
  const d=tblDims(t);
  /* each seat is [x,y,nx,ny]: chair centre and the unit vector pointing away from the table */
  if(t.shape==='round'){const r=d.w/2+24;for(let k=0;k<n;k++){const a=-Math.PI/2+k*2*Math.PI/n;out.push([Math.cos(a)*r,Math.sin(a)*r,Math.cos(a),Math.sin(a)])}return out}
  const P=polyOf(t),m=P.length,L=[];let tot=0;
  for(let i=0;i<m;i++){const a=P[i],b=P[(i+1)%m],l=Math.hypot(b[0]-a[0],b[1]-a[1]);L.push(l);tot+=l}
  const cx=P.reduce((s,p)=>s+p[0],0)/m,cy=P.reduce((s,p)=>s+p[1],0)/m;
  for(let k=0;k<n;k++){
    let dd=(k+.5)/n*tot,i=0;
    while(i<m-1&&dd>L[i]){dd-=L[i];i++}
    const a=P[i],b=P[(i+1)%m],l=L[i]||1,f=dd/l,dx=b[0]-a[0],dy=b[1]-a[1];
    let nx=dy/l,ny=-dx/l;
    const mx=(a[0]+b[0])/2-cx,my=(a[1]+b[1])/2-cy;
    if(nx*mx+ny*my<0){nx=-nx;ny=-ny}
    out.push([a[0]+dx*f+nx*24,a[1]+dy*f+ny*24,nx,ny]);
  }
  return out;
}
/* Move one name inside a table (B===A) or to another table. Returns {a,b} new lists, or {err}. */
function planMove(A,B,eid,idx,over){
  const from=(A.ppl||[]).slice(),i=from.findIndex(x=>x.id===eid);
  if(i<0)return{err:'missing'};
  const e=from.splice(i,1)[0];
  if(!B||B===A){
    let at=idx==null?from.length:(idx>i?idx-1:idx);
    at=Math.max(0,Math.min(from.length,at));from.splice(at,0,e);
    return{a:from,b:null};
  }
  if(!over&&usedOf(B)+Math.max(1,Math.round(N(e.n,1)))>capOf(B))return{err:'full'};
  const to=(B.ppl||[]).slice(),at=idx==null?to.length:Math.max(0,Math.min(to.length,idx));
  to.splice(at,0,e);
  return{a:from,b:to};
}

async function uploadFiles(list){

    try{const r=await S.assets.upload(f);out.push({id:r.id,name:f.name,type:f.type||r.contentType||'',size:f.size})}
    catch(e){

      toast(f.name+': '+(c==='too_large'?'filen er for stor (maks. 20 MB).':c==='unsupported_type'?'filtypen understøttes ikke (brug billede eller PDF).':c==='quota_or_state'?'lageret til filer er fyldt.':'kunne ikke uploades.'));
    }

function extFor(f){
  const m=/\.([A-Za-z0-9]+)$/.exec(f.name||'');const e=m?m[1].toLowerCase():'';
  if(['jpg','jpeg','png','webp','gif','pdf'].includes(e))return e;
  const t=(f.type||'').toLowerCase();
  return t.includes('png')?'png':t.includes('webp')?'webp':t.includes('gif')?'gif':t.includes('pdf')?'pdf':'jpg';
}

function tileStat(k,w){
  const d=S.d;
  if(k==='site')return w.siteUrl?'Åbn jeres færdige hjemmeside':'Tilføj linket til jeres hjemmeside';
  if(k==='guests'){const sm=summarize(docs('guests'),d.rsvp||{},pend());return sm.rows?sm.invTotal+' inviterede · '+sm.ja+' ja · '+sm.afv+' afventer':'Ingen gæster endnu'}
  if(k==='seating'){const tb=docs('tables').filter(isTable),pl=tb.reduce((a,t)=>a+usedOf(t),0);return tb.length?tb.length+(tb.length===1?' bord':' borde')+' · '+pl+' placeret':'Ingen borde endnu'}
  if(k==='budget'){const rows=docs('budget'),sm=summarize(docs('guests'),d.rsvp||{},pend()),c=budgetCalc(rows,sm.inv,sm.rs);return rows.length?kr(c.tot.udgift.r)+' i udgifter efter RSVP':'Ingen poster endnu'}
  if(k==='tasks'){const t=docs('tasks'),open=t.filter(x=>x.status!=='done'),over=open.filter(x=>x.due&&x.due<todayStr());return t.length?open.length+' åbne'+(over.length?' · '+over.length+' over tid':''):'Ingen opgaver endnu'}
  if(k==='calendar'){const it=calItems().filter(x=>x.date>=todayStr()&&x.kind!=='wd')[0];return it?'Næste: '+fshort(it.date)+' · '+it.title:'Ingen kommende frister'}
  if(k==='menu'){const n=docs('menu').length;return n?n+(n===1?' ret':' retter'):'Ingen retter endnu'}
  if(k==='polter'){const n=(w.contacts||[]).filter(c=>(c.sections||[]).includes('polter')).length;return n?n+(n===1?' kontaktperson':' kontaktpersoner'):'Ingen kontaktperson endnu'}
  if(k==='toast'){if(!isContactFor(w,'toast')){const n=(w.contacts||[]).filter(c=>(c.sections||[]).includes('toast')).length;return n?n+(n===1?' kontaktperson':' kontaktpersoner'):'Ingen toastmaster endnu'}const n=docs('speeches').length;return n?n+' indslag':'Ingen indslag endnu'}
  if(k==='gallery'){const n=docs('gallery').length;return n?n+(n===1?' billede':' billeder'):'Ingen billeder endnu'}
  return'';
}

A.dbExport=()=>go(async()=>{
  if(!S.db||!S.wid)return;
  const wid=S.wid,out={format:'brudebordet-backup',version:1,exportedAt:new Date().toISOString(),weddingId:wid,data:{}},missing=[];
  const col=async(key,q)=>{try{const s=await q.get(),m={};s.docs.forEach(d=>{m[d.id]=d.data()});out.data[key]=m}catch(e){missing.push(key)}};
  const one=async(key,r)=>{try{const s=await r.get();out.data[key]=s.exists?s.data():null}catch(e){missing.push(key)}};
  await Promise.all([
    one('weddings/'+wid,S.db.doc('weddings/'+wid)),
    col('priv/guests',S.db.collection('priv/'+wid+'/guests')),
    col('priv/budget',S.db.collection('priv/'+wid+'/budget')),
    col('priv/tasks',S.db.collection('priv/'+wid+'/tasks')),
    col('priv/deadlines',S.db.collection('priv/'+wid+'/deadlines')),
    col('priv/tables',S.db.collection('priv/'+wid+'/tables')),
    one('priv/room/main',S.db.doc('priv/'+wid+'/room/main')),
    col('rsvp',S.db.collection('rsvp').where('wid','==',wid)),
    col('links',S.db.collection('links').where('wid','==',wid)),
    one('links/cfg',S.db.doc('links/cfg_'+wid)),
    col('pub/menu',S.db.collection('pub/'+wid+'/menu')),
    col('pub/gallery',S.db.collection('pub/'+wid+'/gallery')),
    col('pub/speeches',S.db.collection('pub/'+wid+'/speeches')),
    one('pub/polter/main',S.db.doc('pub/'+wid+'/polter/main')),
    one('pub/toast/main',S.db.doc('pub/'+wid+'/toast/main')),
    one('pub/info/main',S.db.doc('pub/'+wid+'/info/main'))
  ]);
  if(missing.length)out.notRead=missing;
  const w=out.data['weddings/'+wid]||{},nm=String(w.names||'bryllup').toLowerCase().replace(/[^a-z0-9æøå]+/g,'-').replace(/^-|-$/g,'')||'bryllup';
  const ok=await saveFile('brudebordet-'+nm+'-'+todayStr()+'.json',new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  if(ok)toast(missing.length?'Gemt, men ikke alt kunne læses ('+missing.length+').':'Sikkerhedskopi gemt.');
});

A.saveWedding=async()=>{
  const w=W(),id=S.wid;if(!w)return;
  const names=val('s-names').trim(),date=val('s-date'),place=val('s-place').trim(),siteUrl=val('s-site').trim();
  if(!names||!date){toast('Navne og dato skal udfyldes.');return}
  const patch={names,date,place,siteUrl};
  if(document.getElementById('s-base'))patch.base=val('s-base').trim();
  await S.db.doc('weddings/'+id).update(patch);
  const tg=w.tokens&&w.tokens.gallery;
  if(tg)await S.db.doc('links/'+tg).set({type:'gallery',wid:id,names,date});
  const gs=docs('guests').filter(g=>g.linked);
  for(let i=0;i<gs.length;i+=8)await Promise.all(gs.slice(i,i+8).map(g=>writeLink(g.id,g,Object.assign({},w,patch))));
  toast('Ændringerne er gemt.');
};

/* manual registration of what a guest could have answered on the RSVP page */
function guestExtraForm(e){
  const cfg=rcfg();let h='';
  const feats=cfg.features.filter(f=>f.items.some(i=>i.title));
  if(feats.length)h+='<div class="stack" style="gap:8px"><strong style="font-size:13px;color:var(--muted)">Tilvalg (gælder, når gæsten kommer)</strong>'+feats.map(f=>'<div class="stack" style="gap:2px"><span style="font-weight:600">'+E(f.title)+'</span>'+f.items.filter(i=>i.title).map(it=>{
    const q=Math.max(0,Math.round(N((e.opts||{})[it.id],0))),on=q>0;
    return'<div class="rsopt"><label class="chk"><input type="checkbox" id="gfo-'+E(it.id)+'"'+(on?' checked':'')+'> <span>'+E(it.title)+' <span class="hint">· '+priceTxt(it)+'</span></span></label>'+(isSum(it)?'':'<label class="rsq"><span class="hint">Antal gæster</span><input type="number" min="1" max="50" class="in" id="gfq-'+E(it.id)+'" value="'+(on?q:1)+'"></label>')+'</div>';
  }).join('')+'</div>').join('')+'</div>';
  if(cfg.speech.on)h+='<div class="stack" style="gap:6px"><label class="chk"><input type="checkbox" id="gf-sp"'+(e.speechOn?' checked':'')+'> Gæsten vil gerne holde et indslag</label><label class="f">Kort beskrivelse af indslaget<textarea id="gf-sptx" class="in" rows="2" maxlength="400">'+E(e.speechText||'')+'</textarea></label></div>';
  return h;
}
function guestForm(g){
  g=g||{};
  /* an answer from the RSVP page is shown as it stands, so a manual save does not overwrite it with stale values */
  const ex=g.id?effGuest(g,(S.d.rsvp||{})[g.id]):{status:g.status,adults:null,children:null,note:g.note,opts:g.opts,speechOn:g.speechOn,speechText:g.speechText};
  if(g.id){g=Object.assign({},g,{status:ex.status,note:ex.note});if(ex.viaLink&&ex.status==='ja'){g.attAdults=ex.adults;g.attChildren=ex.children}}
  return'<div class="stack"><label class="f">Navn<input id="gf-name" class="in" value="'+E(g.name||'')+'"></label><div class="grid2"><label class="f">E-mail<input id="gf-email" type="email" class="in" value="'+E(g.email||'')+'"></label><label class="f">Telefon<input id="gf-phone" class="in" value="'+E(g.phone||'')+'"></label></div>'+
    '<div class="grid3"><label class="f">Relation<input id="gf-group" class="in" placeholder="Brudens familie" value="'+E(g.group||'')+'"></label><label class="f">Voksne inviteret<input id="gf-adults" type="number" min="0" class="in" value="'+N(g.adults,1)+'"></label><label class="f">Børn inviteret<input id="gf-children" type="number" min="0" class="in" value="'+N(g.children,0)+'"></label></div>'+
    '<div class="grid3"><label class="f">Svar<select id="gf-status" class="in"><option value="afventer"'+(g.status!=='ja'&&g.status!=='nej'?' selected':'')+'>Afventer</option><option value="ja"'+(g.status==='ja'?' selected':'')+'>Kommer</option><option value="nej"'+(g.status==='nej'?' selected':'')+'>Kommer ikke</option></select></label><label class="f">Voksne kommer<input id="gf-att-a" type="number" min="0" class="in" placeholder="som inviteret" value="'+(g.attAdults==null?'':g.attAdults)+'"></label><label class="f">Børn kommer<input id="gf-att-c" type="number" min="0" class="in" placeholder="som inviteret" value="'+(g.attChildren==null?'':g.attChildren)+'"></label></div>'+
    guestExtraForm(ex)+
    '<label class="f">Allergier eller andet, vi skal vide<textarea id="gf-note" class="in" rows="2">'+E(g.note||'')+'</textarea></label></div>';
}
A.gAdd=()=>{S.M={type:'guest',id:null};modal('<h2>Tilføj gæst</h2>'+guestForm()+'<div class="foot"><button class="btn" data-a="modalClose">Annuller</button><button class="btn primary" data-a="gSave">Gem</button></div>')};
A.gEdit=el=>{const g0=(S.d.guests||{})[el.dataset.id];if(!g0)return;const g=Object.assign({id:el.dataset.id},g0);S.M={type:'guest',id:el.dataset.id};modal('<h2>Rediger gæst</h2>'+guestForm(g)+'<div class="foot"><button class="btn" data-a="modalClose">Annuller</button><button class="btn primary" data-a="gSave">Gem</button></div>')};
A.gSave=async()=>{
  const name=val('gf-name').trim();if(!name){toast('Skriv gæstens navn.');return}
  const aa=val('gf-att-a'),ac=val('gf-att-c');
  const doc={name,email:val('gf-email').trim(),phone:val('gf-phone').trim(),group:val('gf-group').trim(),adults:Math.max(0,Math.round(num(val('gf-adults')))),children:Math.max(0,Math.round(num(val('gf-children')))),status:val('gf-status'),attAdults:aa===''?null:Math.max(0,Math.round(num(aa))),attChildren:ac===''?null:Math.max(0,Math.round(num(ac))),note:val('gf-note').trim(),manualAt:Date.now()};
  const opts={};
  rcfg().features.forEach(f=>f.items.forEach(it=>{const c=document.getElementById('gfo-'+it.id);if(c&&c.checked)opts[it.id]=isSum(it)?1:Math.max(1,Math.min(50,Math.round(num(val('gfq-'+it.id))||1)))}));
  doc.opts=doc.status==='ja'?opts:{};
  doc.speechOn=doc.status==='ja'&&chk('gf-sp');doc.speechText=doc.speechOn?val('gf-sptx').trim():'';
  const id=S.M&&S.M.id;
  if(id){const old=S.d.guests[id]||{};await S.db.doc(P('guests/'+id)).set(Object.assign({},old,doc));if(doc.group!==old.group)S.db.doc('links/'+id).update({group:doc.group||''}).catch(()=>{})}
  else{const nid=rid(),g=Object.assign({},doc,{linked:true,sentAt:null,createdAt:Date.now()});await S.db.doc(P('guests/'+nid)).set(g);await writeLink(nid,g,W());S.M.id=nid}
  /* the toastmaster's overview follows the manual registration too */
  try{
    const sid=S.M.id,sr=S.db.doc('pub/'+S.wid+'/speeches/'+sid);
    if(doc.speechOn){
      try{await sr.update({name:doc.name,group:doc.group||'',text:doc.speechText,at:Date.now()})}
      catch(e){await sr.set({gid:sid,name:doc.name,group:doc.group||'',text:doc.speechText,at:Date.now(),order:Date.now()})}
    }else await sr.delete();
  }catch(e){}
  closeModal();
};
function writeLink(id,g,w){
  return S.db.doc('links/'+id).set({type:'rsvp',wid:S.wid,gid:id,name:g.name,group:g.group||'',adults:N(g.adults,1),children:N(g.children,0),names:w.names,date:w.date,place:w.place||''});
}

/* Excel import / export */
A.gImport=()=>{
  if(typeof XLSX==='undefined'){toast('Excel-biblioteket kunne ikke hentes. Tjek din forbindelse.');return}
  S.M={type:'import',rows:null,map:null};
  modal('<h2>Importér gæster fra Excel</h2><p class="lead" style="margin:0 0 14px">Vælg en .xlsx-, .xls- eller .csv-fil. Første række skal være overskrifter. Kolonnerne genkendes automatisk, og du kan rette dem bagefter.</p><label class="f">Fil<input id="imp-file" type="file" class="in" accept=".xlsx,.xls,.csv" data-c="impFile"></label><div class="foot"><button class="btn" data-a="modalClose">Annuller</button></div>',{wide:true,noFocus:true});
};
C.impFile=async el=>{
  const f=el.files&&el.files[0];if(!f)return;
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',blankrows:false});
  if(rows.length<2){toast('Filen har ingen rækker under overskrifterne.');return}
  S.M={type:'import',rows,map:autoMap(rows[0])};
  drawImport();
};
function drawImport(){
  const M=S.M,head=M.rows[0],body=M.rows.slice(1);
  const parsed=body.map(r=>rowToGuest(r,M.map));
  const ok=parsed.filter(Boolean),skipped=parsed.length-ok.length;
  const opts=sel=>'<option value="-1">(ingen)</option>'+head.map((x,i)=>'<option value="'+i+'"'+(i===sel?' selected':'')+'>'+E(String(x||('Kolonne '+(i+1))))+'</option>').join('');
  const m=$('#modal-root .modal');if(!m)return;
  m.innerHTML='<h2>Tjek kolonnerne</h2><div class="grid3">'+FIELDS.map(f=>'<label class="f">'+E(f[1])+'<select class="in" data-c="impMap" data-k="'+f[0]+'">'+opts(M.map[f[0]])+'</select></label>').join('')+'</div>'+
    '<p class="hint" style="margin:12px 0 8px">'+ok.length+' gæster er klar til import'+(skipped?' · '+skipped+' rækker uden navn springes over':'')+'. Gæster med samme e-mail eller navn som en eksisterende gæst springes over.</p>'+
    '<div class="scroll"><table class="tbl tbl-small"><thead><tr><th>Navn</th><th>E-mail</th><th>Relation</th><th class="r">Voksne</th><th class="r">Børn</th><th>Svar</th></tr></thead><tbody>'+ok.slice(0,6).map(g=>'<tr><td>'+E(g.name)+'</td><td>'+E(g.email)+'</td><td>'+E(g.group)+'</td><td class="r">'+g.adults+'</td><td class="r">'+g.children+'</td><td>'+E(g.status)+'</td></tr>').join('')+'</tbody></table></div>'+
    '<div class="foot"><button class="btn" data-a="modalClose">Annuller</button><button class="btn primary" data-a="impGo"'+(ok.length?'':' disabled')+'>Importér '+ok.length+' gæster</button></div>';
}
C.impMap=el=>{S.M.map[el.dataset.k]=parseInt(el.value,10);drawImport()};
A.impGo=async el=>{
  const M=S.M,w=W();if(!M||!M.rows)return;
  el.disabled=true;el.textContent='Importerer…';
  const existing=guestSorted(),seen=new Set();
  existing.forEach(g=>{if(g.email)seen.add('e:'+g.email.toLowerCase());seen.add('n:'+String(g.name).toLowerCase())});
  const fresh=[];
  M.rows.slice(1).map(r=>rowToGuest(r,M.map)).filter(Boolean).forEach(g=>{
    const k1=g.email?'e:'+g.email.toLowerCase():null,k2='n:'+g.name.toLowerCase();
    if((k1&&seen.has(k1))||seen.has(k2))return;
    if(k1)seen.add(k1);seen.add(k2);fresh.push(g);
  });
  let n=0;
  for(let i=0;i<fresh.length;i+=8){
    await Promise.all(fresh.slice(i,i+8).map(async g=>{
      const id=rid(),doc=Object.assign({},g,{linked:true,sentAt:null,createdAt:Date.now(),manualAt:Date.now()});
      await S.db.doc(P('guests/'+id)).set(doc);await writeLink(id,doc,w);n++;
    }));
  }
  closeModal();toast(n+' gæster er importeret.'+(fresh.length<M.rows.length-1?' Dubletter og rækker uden navn blev sprunget over.':''));
};
A.gTemplate=async()=>{
  if(typeof XLSX==='undefined'){toast('Excel-biblioteket kunne ikke hentes.');return}
  const ws=XLSX.utils.aoa_to_sheet([['Navn','E-mail','Telefon','Relation','Voksne','Børn','Svar','Note']]);
  ws['!cols']=[{wch:26},{wch:28},{wch:16},{wch:20},{wch:9},{wch:9},{wch:12},{wch:30}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Gæster');
  await saveFile('gaesteliste-skabelon.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
};
A.gExport=async()=>{
  if(typeof XLSX==='undefined'){toast('Excel-biblioteket kunne ikke hentes.');return}
  const ans=S.d.rsvp||{};
  const rows=[['Navn','E-mail','Telefon','Relation','Voksne inviteret','Børn inviteret','Svar','Voksne kommer','Børn kommer','Note','Tilvalg','Egenbetaling (kr.)','Indbydelse sendt']].concat(guestSorted().map(g=>{
    const e=effGuest(g,ans[g.id]);
    return[g.name,g.email||'',g.phone||'',g.group||'',N(g.adults,1),N(g.children,0),e.status==='ja'?'Ja':e.status==='nej'?'Nej':'Afventer',e.adults,e.children,e.note||g.note||'',optRows(e).map(r=>r.f.title+': '+r.it.title+(r.q>1?' ×'+r.q:'')).join('; '),optRows(e).reduce((a,r)=>a+r.amt,0),g.sentAt?ymd(new Date(g.sentAt)):''];
  }));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Gæster');
  await saveFile('gaesteliste.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
};

/* Invitations */
const DEFAULT_INVITE={subject:'Du er inviteret til {brudepar}s bryllup',body:'Kære {navn},\n\nVi giver hinanden ja den {dato} – {sted} – og vil så gerne fejre dagen sammen med dig.\n\nGiv os besked om du kommer her: {link}\n\nKærlig hilsen\n{brudepar}'};
const inviteTpl=w=>Object.assign({},DEFAULT_INVITE,w&&w.invite||{});
function fillTpl(t,g,w){
  const link=base()?base()+'#'+g.id:'[link mangler – indsæt platformens link under Indstillinger]';
  return t.replace(/\{navn\}/gi,g.name||'').replace(/\{brudepar\}/gi,w.names||'').replace(/\{dato\}/gi,fdate(w.date)).replace(/\{sted\}/gi,w.place||'').replace(/\{link\}/gi,link);
}
function inviteHtml(w,gs){
  const t=inviteTpl(w),sel=S.ui.sel;
  let h='';
  if(!base())h+='<div class="panel" style="margin-bottom:14px;border-color:var(--warn)"><strong>Link mangler.</strong> <span class="muted">Indsæt platformens delbare link, så gæsterne kan svare via deres personlige RSVP-link.</span><div class="row" style="margin-top:10px"><input id="base-in" class="in" style="max-width:420px" placeholder="https://claude.ai/artifact/…"><button class="btn primary" data-a="saveBase">Gem link</button></div></div>';
  h+='<div class="panel stack" style="margin-bottom:16px"><label class="f">Emne<input id="inv-sub" class="in" data-c="invSave" value="'+E(t.subject)+'"></label><label class="f">Besked<textarea id="inv-body" class="in" rows="9" data-c="invSave">'+E(t.body)+'</textarea></label><p class="hint">Brug {navn}, {brudepar}, {dato}, {sted} og {link}. Hver gæst får sit eget RSVP-link. Svar fra linket lander automatisk på gæstelisten.</p></div>';
  h+='<div class="bar"><div class="row"><button class="btn" data-a="invAll">Vælg alle uden indbydelse</button><button class="btn" data-a="invNone">Fjern valg</button></div><div class="row"><button class="btn" data-a="invCopyMails">'+ico('copy','s')+' Kopiér e-mails</button><button class="btn" data-a="invCsv">'+ico('dl','s')+' Flettefil (csv)</button><button class="btn" data-a="invMark">Markér valgte som sendt</button><button class="btn" data-a="genLinks">Opdatér RSVP-links</button></div></div>';
  if(!gs.length)return h+'<div class="empty"><h3>Ingen gæster at invitere</h3><p>Tilføj eller importér gæster først.</p></div>';
  h+='<div class="panel" style="padding:6px"><div class="scroll"><table class="tbl" style="min-width:640px"><thead><tr><th></th><th>Gæst</th><th>E-mail</th><th>Status</th><th></th></tr></thead><tbody>'+gs.map(g=>'<tr><td><input type="checkbox" data-c="invSel" data-id="'+E(g.id)+'"'+(sel[g.id]?' checked':'')+' aria-label="Vælg '+E(g.name)+'"></td><td><strong>'+E(g.name)+'</strong></td><td>'+(g.email?E(g.email):'<span class="muted">mangler</span>')+'</td><td>'+(g.sentAt?'<span class="chip ok">Sendt '+E(fshort(ymd(new Date(g.sentAt))))+'</span>':'<span class="chip">Ikke sendt</span>')+'</td><td class="r nowrap"><button class="btn sm" data-a="invCopy" data-id="'+E(g.id)+'">'+ico('copy','s')+' Kopiér besked</button> '+(g.email?'<a class="btn sm" href="'+E(mailtoFor(g,w))+'" data-a="invMail" data-native="1" data-id="'+E(g.id)+'">'+ico('mail','s')+' Åbn mail</a>':'')+'</td></tr>').join('')+'</tbody></table></div></div><p class="hint" style="margin-top:10px">Platformen sender ikke selv e-mails. «Åbn mail» bruger din mailapp, hvis din browser tillader det. Ellers kopierer du beskeden eller bruger flettefilen. Efter afsendelse markerer du gæsterne som sendt.</p>';
  return h;
}
const mailtoFor=(g,w)=>{const t=inviteTpl(w);return'mailto:'+encodeURIComponent(g.email||'')+'?subject='+encodeURIComponent(fillTpl(t.subject,g,w))+'&body='+encodeURIComponent(fillTpl(t.body,g,w))};
C.invSave=async()=>{await S.db.doc('weddings/'+S.wid).update({invite:{subject:val('inv-sub'),body:val('inv-body')}})};
C.invSel=el=>{if(el.checked)S.ui.sel[el.dataset.id]=true;else delete S.ui.sel[el.dataset.id]};
A.invAll=()=>{S.ui.sel={};guestSorted().filter(g=>!g.sentAt&&g.email).forEach(g=>{S.ui.sel[g.id]=true});render()};
A.invNone=()=>{S.ui.sel={};render()};
const selGuests=()=>{const ids=Object.keys(S.ui.sel);return guestSorted().filter(g=>ids.includes(g.id))};
A.invCopy=el=>{const g=S.d.guests[el.dataset.id],w=W(),t=inviteTpl(w);if(!g)return;copyText('Emne: '+fillTpl(t.subject,Object.assign({id:el.dataset.id},g),w)+'\n\n'+fillTpl(t.body,Object.assign({id:el.dataset.id},g),w),'Beskeden')};
A.invMail=()=>{toast('Åbner din mailapp. Husk at markere gæsten som sendt bagefter.')};
A.invCopyMails=()=>{const l=selGuests().map(g=>g.email).filter(Boolean);if(!l.length){toast('Vælg gæster med e-mail først.');return}copyText(l.join('; '),l.length+' e-mailadresser')};
A.invCsv=async()=>{
  const list=selGuests().length?selGuests():guestSorted(),w=W(),t=inviteTpl(w);
  const rows=[['Navn','E-mail','Emne','Besked','RSVP-link']].concat(list.map(g=>[g.name,g.email||'',fillTpl(t.subject,g,w),fillTpl(t.body,g,w),base()?base()+'#'+g.id:'']));
  await saveFile('indbydelser-flettefil.csv',toCsv(rows));
};
A.invMark=async()=>{
  const l=selGuests();if(!l.length){toast('Vælg gæster, der er sendt til.');return}
  const now=Date.now();
  for(let i=0;i<l.length;i+=8)await Promise.all(l.slice(i,i+8).map(g=>S.db.doc(P('guests/'+g.id)).update({sentAt:now})));
  S.ui.sel={};toast(l.length+' gæster er markeret som sendt.');
};
A.genLinks=async()=>{
  const w=W(),l=guestSorted();
  for(let i=0;i<l.length;i+=8)await Promise.all(l.slice(i,i+8).map(async g=>{await writeLink(g.id,g,w);if(!g.linked)await S.db.doc(P('guests/'+g.id)).update({linked:true})}));
  toast('RSVP-links er opdateret for '+l.length+' gæster.');
};
A.saveBase=async()=>{const v=val('base-in').trim();if(!v){toast('Indsæt linket først.');return}await S.db.doc('weddings/'+S.wid).update({base:v});toast('Linket er gemt.')};

/* ================= budget ================= */
const MODES=[['fixed','Fast antal'],['guest','Pr. gæst'],['adult','Pr. voksen'],['child','Pr. barn']];
const kindLabel=k=>k==='indtaegt'?'Indtægter':'Udgifter';
function budgetView(w){
  const rows=docs('budget'),sm=summarize(docs('guests'),S.d.rsvp||{},pend()),c=budgetCalc(rows,sm.inv,sm.rs),hasRv=addRsvpIncome(c);
  const cnt={inv:sm.inv,rs:sm.rs};
  const hide=S.ui.bHideInc;
  let h='<div class="stats"><div class="stat-box"><div class="k">Udgifter realiseret</div><div class="v">'+kr(c.tot.udgift.r)+'</div><div class="s">oprindeligt '+kr(c.tot.udgift.o)+'</div></div>'+(hide?'':
    '<div class="stat-box"><div class="k">Indtægter realiseret</div><div class="v">'+kr(c.tot.indtaegt.r)+'</div><div class="s">oprindeligt '+kr(c.tot.indtaegt.o)+'</div></div>'+
    '<div class="stat-box"><div class="k">Resultat realiseret</div><div class="v" style="color:'+(c.net.r<0?'var(--bad)':'var(--ok)')+'">'+kr(c.net.r)+'</div><div class="s">oprindeligt '+kr(c.net.o)+'</div></div>')+'</div>';
  h+='<div class="bar"><div class="stack" style="gap:4px"><p class="hint">Oprindeligt budget regner med '+sm.invTotal+' inviterede gæster. Kolonnen «Realiseret» udfyldes med det oprindelige beløb, når en post oprettes. Ret den til de faktiske udgifter. Poster uden eget beløb følger stadig gæstelisten ('+sm.rsTotal+' forventede gæster).</p>'+
    '<div class="row" style="gap:18px"><label class="chk"><input type="checkbox" data-c="pendTog"'+(pend()?' checked':'')+'> Afventende gæster tæller med i poster, der følger gæstelisten</label><label class="chk"><input type="checkbox" data-c="bInc"'+(hide?' checked':'')+'> Skjul indtægter</label></div></div>'+
    '<div class="row"><button class="btn" data-a="bAddH">'+ico('plus','s')+' Ny overskrift</button><button class="btn primary" data-a="bAddI">'+ico('plus','s')+' Nyt underpunkt</button></div></div>';
  if(!rows.length&&!hasRv)return h+'<div class="empty"><h3>Budgettet er tomt</h3><p>Start med en overskrift som «Tøj» og tilføj underpunkter som brudekjole og smoking. Indtægter, fx bidrag fra svigerforældre eller udlejning af værelser, får deres egen overskrift.</p></div>';
  h+='<div class="panel" style="padding:6px"><div class="scroll"><table class="tbl" style="min-width:860px"><thead><tr><th>Post</th><th class="r">Pris</th><th>Antal</th><th class="r">Oprindeligt</th><th class="r">Realiseret</th><th class="c">Betalt</th><th></th></tr></thead><tbody>';
  ['udgift','indtaegt'].forEach(kind=>{
    if(hide&&kind==='indtaegt')return;
    const k=kind==='udgift'?'udgift':'indtaegt',key=k==='udgift'?'udgift':'indtaegt';
    const secs=c.sections.filter(s=>s.kind===k),loose=c.loose[k==='udgift'?'udgift':'indtaegt'];
    if(!secs.length&&!loose.length)return;

function subSum(pid,ov,act){
  const val=t=>act&&t.final!==undefined&&t.final!==null&&t.final!==''?N(t.final,0):N(t.price,0);
  let sum=0;const seen=new Set();
  subsOf(pid).forEach(t=>{seen.add(t.id);if(ov&&ov.id===t.id){if(!ov.deleted)sum+=val(ov)}else sum+=val(t)});
  if(ov&&!seen.has(ov.id)&&!ov.deleted)sum+=val(ov);
  return sum;

async function syncExtra(pid,ov){
  const p=(S.d.tasks||{})[pid];if(!p)return;
  const sum=subSum(pid,ov),sumAct=subSum(pid,ov,true);
  const rowId=p.budgetRow||(docs('budget').find(r=>r.taskId===pid)||{}).id;
  if(rowId&&(S.d.budget||{})[rowId]){await bref(rowId).update(withActual(S.d.budget[rowId],{extra:sum,extraAct:sumAct,taskId:pid}));if(!p.hasBudget)await tref2(pid).update({hasBudget:true,budgetRow:rowId});return}
  if(sum>0){
    const par=await ensureTaskSection(),nid=rid();
    const nr={t:'i',kind:'udgift',parent:par,title:p.title,order:Date.now(),taskId:pid,price:0,mode:'fixed',qty:1,extra:sum,extraAct:sumAct};

function taskMatch(t,f){

  if(f.status&&t.status!==f.status)return false;
  if(f.who==='__none'){if(t.assignee)return false}else if(f.who&&t.assignee!==f.who)return false;
  if(f.budget==='ja'&&!t.hasBudget)return false;
  if(f.budget==='nej'&&t.hasBudget)return false;
  const hf=!!(t.files&&t.files.length);
  if(f.files==='ja'&&!hf)return false;
  if(f.files==='nej'&&hf)return false;
  if(f.from&&(!t.due||t.due<f.from))return false;
  if(f.to&&(!t.due||t.due>f.to))return false;
  return true;
}

async function saveTask(){
  captureTask();
  const d=S.M.draft,title=d.title.trim();
  if(!title){toast('Giv opgaven en overskrift.');return null}
  const id=S.M.id||rid(),old=S.M.id?((S.d.tasks||{})[id]||{}):{};
  if(d.parent){
    const price=num(d.price),fin=String(d.final==null?'':d.final).trim()===''?null:num(d.final);
    await tref2(id).set({title,desc:d.desc||'',due:d.due||'',status:d.status||'todo',assignee:d.assignee||'',hasBudget:false,budgetRow:null,price,final:fin,parent:d.parent,files:d.files||[],order:old.order||Date.now(),createdAt:old.createdAt||Date.now()});
    S.M.id=id;
    await syncExtra(d.parent,{id,price,final:fin});
    return id;
  }
  let rowId=d.budgetRow||(docs('budget').find(r=>r.taskId===id)||{}).id||null;
  const extra=subSum(id),extraAct=subSum(id,null,true);
  if(d.hasBudget){
    let parent=d.bsec;
    if(parent==='__auto'||(!parent)||(parent!=='__keep'&&!(S.d.budget||{})[parent]))parent=await ensureTaskSection();
    const row=rowId&&(S.d.budget||{})[rowId];
    const mode=d.mode||'fixed',amt={price:num(d.price),mode,qty:mode==='fixed'?(String(d.qty).trim()===''?1:num(d.qty)):1,extra,extraAct};
    if(row){await bref(rowId).update(withActual(row,Object.assign({taskId:id},parent==='__keep'?{}:{parent},amt)))}
    else{rowId=rowId||rid();const nr=Object.assign({t:'i',kind:'udgift',parent:parent==='__keep'?'':parent,title,order:Date.now(),taskId:id},amt);nr.actual=newActual(nr);await bref(rowId).set(nr)}
  }else if(rowId){
    const row=(S.d.budget||{})[rowId];
    if(row){if(N(row.price,0)===0&&!extra)await bref(rowId).delete();else await bref(rowId).update({taskId:null,extra:0})}
    rowId=null;
  }
  await tref2(id).set({title,desc:d.desc||'',due:d.due||'',status:d.status||'todo',assignee:d.assignee||'',hasBudget:!!d.hasBudget,budgetRow:rowId,files:d.files||[],order:old.order||Date.now(),createdAt:old.createdAt||Date.now()});
  S.M.id=id;
  return id;
}

      for(const x of subsOf(id))await tref2(x.id).delete();

};

function calItems(){
  const out=[],w=W(),sm=summarize(docs('guests'),S.d.rsvp||{},pend());
  /* price: a subtask's own amount, or the budget line of a main task */
  const priceOf=t=>{if(t.parent)return N(t.price,0)||null;const r=t.budgetRow&&(S.d.budget||{})[t.budgetRow];return r?(amountOf(r,sm.rs)||null):null};
  if(w&&w.date)out.push({date:w.date,kind:'wd',id:'wd',title:'Bryllupsdagen'});
  docs('tasks').forEach(t=>{if(t.due)out.push({date:t.due,kind:'task',id:t.id,price:priceOf(t),title:(t.parent&&(S.d.tasks||{})[t.parent]?S.d.tasks[t.parent].title+' › ':'')+t.title,done:t.status==='done',who:t.assignee})});
  docs('deadlines').forEach(d=>{if(d.date)out.push({date:d.date,kind:'dl',id:d.id,title:d.title,note:d.note})});
  return out.sort((a,b)=>a.date.localeCompare(b.date)||String(a.title).localeCompare(String(b.title),'da'));
}

  items.forEach(i=>{const d=parseD(i.date);if(!d)return;const m=new Date(d.getFullYear(),d.getMonth(),1);if(m<start)start=m;if(m>end)end=m});

  modal('<h2>'+(d.id?'Deadline':'Ny deadline')+'</h2><div class="stack"><label class="f">Overskrift<input id="dl-t" class="in" value="'+E(d.title||'')+'"></label><label class="f">Dato<input id="dl-d" type="date" class="in" value="'+E(d.date||'')+'"></label><label class="f">Note<textarea id="dl-n" class="in" rows="3">'+E(d.note||'')+'</textarea></label></div><div class="foot">'+(d.id?'<button class="btn danger'+(S.ui.confirm==='dldel'?' armed':'')+'" data-a="dlDel" style="margin-right:auto">'+(S.ui.confirm==='dldel'?'Sikker? Slet':'Slet')+'</button>':'')+'<button class="btn" data-a="modalClose">Annuller</button><button class="btn primary" data-a="dlSave">Gem</button></div>');
}
A.calMakeDl=el=>{closeModal();dlModal({date:el.dataset.d})};
A.dlSave=async()=>{
  const title=val('dl-t').trim(),date=val('dl-d');
  if(!title||!date){toast('Skriv en overskrift og vælg en dato.');return}
  const id=(S.M&&S.M.id)||rid();
  await S.db.doc(P('deadlines/'+id)).set({title,date,note:val('dl-n').trim(),createdAt:Date.now()});

};
A.dlDel=async()=>{
  const id=S.M&&S.M.id;if(!id)return;
  if(S.ui.confirm==='dldel'){S.ui.confirm='';await S.db.doc(P('deadlines/'+id)).delete();closeModal();return}
  S.ui.confirm='dldel';dlModal(Object.assign({id},S.d.deadlines[id]||{}));
  setTimeout(()=>{S.ui.confirm=''},4000);
};
A.calItem=(el)=>{
  const k=el.dataset.k,id=el.dataset.id;
  if(k==='task')openTaskModal(id);
  else if(k==='dl'){const d=(S.d.deadlines||{})[id];if(d)dlModal(Object.assign({id},d))}

/* ================= seating plan (bordplan) ================= */
const SHAPES=[['round','Rundt'],['square','Firkantet'],['rhombus','Rombeformet'],['triangle','Trekantet']];
const shapeName=k=>(SHAPES.find(s=>s[0]===k)||['','Firkantet'])[1];
const DIMLAB={round:['Diameter (cm)',null],square:['Længde (cm)','Bredde (cm)'],rect:['Længde (cm)','Bredde (cm)'],rhombus:['Bredde (cm)','Højde (cm)'],triangle:['Bund (cm)','Højde (cm)']};
const KINDS=[['table','Bord med siddepladser'],['stage','Scene'],['buffet','Buffet'],['coffee','Kaffebord'],['bar','Bar'],['dance','Dansegulv'],['other','Andet']];
const KDEF={table:{shape:'round',w:'150',h:'',seats:'8'},stage:{shape:'square',w:'600',h:'300',seats:''},buffet:{shape:'square',w:'300',h:'80',seats:''},coffee:{shape:'square',w:'200',h:'80',seats:''},bar:{shape:'square',w:'250',h:'80',seats:''},dance:{shape:'square',w:'500',h:'500',seats:''},other:{shape:'square',w:'100',h:'100',seats:''}};
const kindName=k=>(KINDS.find(x=>x[0]===k)||['','Element'])[1];
const tName=t=>isTable(t)?'Bord '+t.no:String(t.no||kindName(t.kind));
/* first free spot in the room (centre x,y) for an element with half-size hw,hh; tables count with room for chairs */
function freeSpot(W,H,hw,hh,list){
  const box=t=>{const d=tblDims(t),m=isTable(t)?90:0;return{hw:d.w/2+m,hh:d.h/2+m}};
  for(let y=hh+20;y<=H-hh-20;y+=50)for(let x=hw+20;x<=W-hw-20;x+=50){
    if(!list.some(t=>{const b=box(t);return Math.abs(N(t.x,0)-x)<b.hw+hw&&Math.abs(N(t.y,0)-y)<b.hh+hh}))return[x,y];
  }
  return[Math.round(Math.max(hw,Math.min(W-hw,W/2))),Math.round(Math.max(hh,Math.min(H-hh,H/2)))];
}
function nextNo(){const n=docs('tables').filter(isTable).map(t=>parseInt(t.no,10)).filter(Number.isFinite);return String((n.length?Math.max.apply(null,n):0)+1)}
const roomOf=()=>{const r=S.d.room||{};return{w:Math.min(100,Math.max(3,N(r.w,12))),h:Math.min(100,Math.max(3,N(r.h,8)))}};
const tblSort=(a,b)=>String(a.no).localeCompare(String(b.no),'da',{numeric:true});
const tref=id=>S.db.doc(P('tables/'+id));
const dimsText=t=>{const d=tblDims(t);return t.shape==='round'?'Ø '+Math.round(d.w)+' cm':Math.round(d.w)+' × '+Math.round(d.h)+' cm'};
function entryStatus(e){
  if(!e||!e.gid)return'';
  const g=(S.d.guests||{})[e.gid];if(!g)return'';
  return effGuest(g,(S.d.rsvp||{})[e.gid]).status;
}
function placedSet(){const s=new Set();Object.values(S.d.tables||{}).forEach(t=>(t.ppl||[]).forEach(e=>{if(e.gid)s.add(e.gid)}));return s}
const unplaced=()=>{const p=placedSet();return guestSorted().filter(g=>!p.has(g.id))};
function partyOf(g){
  const e=effGuest(g,(S.d.rsvp||{})[g.id]);
  return Math.max(1,e.status==='ja'?e.adults+e.children:N(g.adults,1)+N(g.children,0));
}

/* "Anna og Peter Hansen" -> ["Anna Hansen","Peter Hansen"]; the word "og" is dropped */
function splitNames(n){
  const parts=String(n||'').split(/\s+(?:og|&)\s+|\s*\+\s*/i).map(x=>x.trim()).filter(Boolean);
  if(parts.length<2)return parts.length?parts:[String(n||'').trim()];
  const last=parts[parts.length-1].split(/\s+/);
  if(last.length>1){const sur=last.slice(1).join(' ');return parts.map((x,i)=>i<parts.length-1&&x.split(/\s+/).length===1?x+' '+sur:x)}
  return parts;
}
/* "Anna Marie Hansen" -> "Anna H." on the plan; the full name stays in the lists */
function shortName(n){
  n=String(n||'').trim();
  if(n.length<=13)return n;
  const w=n.split(/\s+/);
  if(w.length>1)n=w[0]+' '+w[w.length-1].charAt(0).toUpperCase()+'.';
  return n.length>14?n.slice(0,13)+'…':n;
}

/* ---- the floor plan drawing ---- */
function planSvg(list){
  const r=roomOf(),W=Math.round(r.w*100),H=Math.round(r.h*100),fs=Math.max(16,Math.round(W/55));
  let s='<svg class="plan" id="plan" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bordplan. Træk i et bord for at flytte det, tryk for at rette det.">';
  s+='<rect class="floor" x="0" y="0" width="'+W+'" height="'+H+'"/>';
  for(let x=100;x<W;x+=100)s+='<line class="gl" x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'"/>';
  for(let y=100;y<H;y+=100)s+='<line class="gl" x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'"/>';
  list.forEach(t=>{
    const x=Math.min(W,Math.max(0,N(t.x,W/2))),y=Math.min(H,Math.max(0,N(t.y,H/2)));
    const u=unitsOf(t),pts=seatPoints(t),d=tblDims(t),isT=isTable(t);
    s+='<g data-tdrag="'+E(t.id)+'" transform="translate('+x+' '+y+')"><title>'+E(tName(t))+'</title>';
    let lbl='';const seen=new Set(),nf=Math.max(11,Math.round(fs*0.62)),sw=Math.max(3,Math.round(nf*0.28));
    pts.forEach((p,i)=>{
      const e=u[i],cls=e?(entryStatus(e)==='nej'?' no':' on'):'';
      /* chair: 44 cm along the table edge, 26 cm deep, long side towards the table */
      const rot=Math.round(Math.atan2(-p[2],p[3])*180/Math.PI);
      s+='<rect class="ch'+cls+'" x="-22" y="-13" width="44" height="26" rx="6" transform="translate('+Math.round(p[0])+' '+Math.round(p[1])+') rotate('+rot+')"/>';
      if(e&&!seen.has(e.id)){
        seen.add(e.id);
        /* name sits just outside the chair, slanted away from the table so it takes little room */
        const right=p[2]>=0,down=p[3]>0,ang=(right?1:-1)*35*(down?1:-1);
        const lx=Math.round(p[0]+p[2]*20),ly=Math.round(p[1]+p[3]*20);
        const k=Math.max(1,Math.round(N(e.n,1)));
        lbl+='<text class="nm'+(entryStatus(e)==='nej'?' no':'')+'" font-size="'+nf+'" x="0" y="0" transform="translate('+lx+' '+ly+') rotate('+ang+')" style="text-anchor:'+(right?'start':'end')+'" stroke-width="'+sw+'">'+E(shortName(e.name))+(k>1?' ('+k+')':'')+'</text>';
      }
    });
    /* a button on the plan turns square elements 90 degrees (swaps length and width) */
    if((t.shape==='square'||t.shape==='rect')&&Math.round(d.w)!==Math.round(d.h)){
      const rb=Math.max(15,Math.round(fs*0.8)),off=isT?44:16,k=(rb*0.85).toFixed(1);
      lbl+='<g class="rotbtn" data-a="elRot" data-id="'+E(t.id)+'" transform="translate('+Math.round(d.w/2+off)+' '+(-Math.round(d.h/2+off))+')" role="button" aria-label="Vend 90 grader"><title>Vend 90 grader</title><circle r="'+rb+'"/><g transform="scale('+k+')"><path d="M -0.6 -0.25 A 0.65 0.65 0 1 1 -0.25 0.6"/><path d="M 0.097 0.556 L -0.25 0.6 L -0.038 0.878"/></g></g>';
    }
    const tc='tb'+(isT?'':' el');
    if(t.shape==='round')s+='<circle class="'+tc+'" r="'+Math.round(d.w/2)+'"/>';
    else s+='<polygon class="'+tc+'" points="'+polyOf(t).map(p=>Math.round(p[0])+','+Math.round(p[1])).join(' ')+'"/>';
    if(isT)s+='<text font-size="'+fs+'" y="'+(-Math.round(fs*0.3))+'">Bord '+E(t.no)+'</text><text class="sub" font-size="'+Math.round(fs*0.8)+'" y="'+Math.round(fs*0.8)+'">'+usedOf(t)+'/'+capOf(t)+'</text>'+lbl+'</g>';
    else{const lb=tName(t),f2=Math.max(10,Math.min(fs,Math.floor(d.w/(Math.max(3,lb.length)*0.62))));s+='<text font-size="'+f2+'" y="0">'+E(lb)+'</text>'+lbl+'</g>'}
  });
  return s+'</svg>';
}

/* ---- main view ---- */
function seatingView(w){
  const all=docs('tables').sort(tblSort),tables=all.filter(isTable),others=all.filter(t=>!isTable(t)),r=roomOf(),un=unplaced();
  const seatsTot=tables.reduce((a,t)=>a+capOf(t),0),usedTot=tables.reduce((a,t)=>a+usedOf(t),0);
  let declined=0;tables.forEach(t=>unitsOf(t).forEach(e=>{if(entryStatus(e)==='nej')declined++}));
  let h='<div class="bar"><div><h2>Bordplan</h2><p class="lead">Angiv salens mål, opret borde, scene, buffet, bar og andre elementer, og træk dem derhen, hvor de skal stå. Skriv gæsternes navne under bordene.</p></div><div class="row"><button class="btn" data-a="planPrint">'+ico('dl','s')+' Print bordplan</button><button class="btn primary" data-a="tblNew">'+ico('plus','s')+' Nyt element</button></div></div>';
  h+='<div class="stats"><div class="stat-box"><div class="k">Borde</div><div class="v">'+tables.length+'</div><div class="s">'+seatsTot+' stole i alt'+(others.length?' · '+others.length+(others.length===1?' andet element':' andre elementer'):'')+'</div></div>'+
    '<div class="stat-box"><div class="k">Placeret</div><div class="v">'+usedTot+'</div><div class="s">af '+seatsTot+' pladser · '+un.length+(un.length===1?' gæst':' gæster')+' uden bord'+(declined?' · <span style="color:var(--bad);font-weight:600">'+declined+' afbud</span>':'')+'</div></div></div>';
  h+='<div class="panel" style="margin-bottom:16px"><div class="row"><strong>Salens mål</strong><label class="f" style="flex-direction:row;align-items:center;gap:8px">Bredde (m)<input id="sr-w" class="in" style="width:92px" inputmode="decimal" data-c="roomSave" value="'+E(String(r.w).replace('.',','))+'"></label><label class="f" style="flex-direction:row;align-items:center;gap:8px">Længde (m)<input id="sr-h" class="in" style="width:92px" inputmode="decimal" data-c="roomSave" value="'+E(String(r.h).replace('.',','))+'"></label><span class="hint">Salen er '+E(String(r.w).replace('.',','))+' × '+E(String(r.h).replace('.',','))+' m. Rutenettet er 1 meter.'+(S.d.room?'':' Indtast jeres egne mål for at gemme dem.')+'</span></div></div>';
  h+=planSvg(all);
  if(!all.length)h+='<div class="empty" style="margin-top:16px"><h3>Ingen elementer endnu</h3><p>Tryk på «Nyt element», og vælg bord, scene, buffet, kaffe eller bar. Borde får stole og kan fyldes med gæster.</p></div>';
  else{
    if(tables.length)h+='<div class="seatgrid">'+tables.map(tableCard).join('')+'</div>';
    if(others.length)h+='<div class="panel" style="margin-top:18px"><strong>Øvrige elementer</strong><div class="row" style="margin-top:10px">'+others.map(t=>'<button class="btn" data-a="tblEdit" data-id="'+E(t.id)+'">'+E(tName(t))+' · '+E(dimsText(t))+' '+ico('edit','s')+'</button>').join('')+'</div></div>';
  }
  if(un.length)h+='<details class="panel" style="margin-top:18px"><summary style="cursor:pointer;font-weight:600">'+un.length+(un.length===1?' gæst':' gæster')+' mangler et bord</summary><p class="muted" style="margin-top:8px">'+un.map(g=>E(g.name)).join(', ')+'</p></details>';
  return h;
}
function tableCard(t){
  const id=E(t.id),u=usedOf(t),c=capOf(t),ppl=t.ppl||[];
  const over=u>c?u-c:0;
  let h='<article class="panel seatcard'+(over?' overfull':'')+'" data-sdrop="'+id+'"><div class="bar" style="margin-bottom:6px"><div><h3>Bord '+E(t.no)+'</h3><p class="hint">'+E(shapeName(t.shape))+' · '+E(dimsText(t))+'</p></div><div class="row" style="gap:6px"><span class="chip'+(over?' bad':u>=c?' ok':'')+'">'+u+'/'+c+' pladser</span><button class="btn sm ghost" data-a="tblEdit" data-id="'+id+'" aria-label="Rediger bord '+E(t.no)+'">'+ico('edit','s')+'</button></div></div>';
  h+=ppl.map((e,i)=>{
    const st=entryStatus(e),n=Math.max(1,Math.round(N(e.n,1)));
    return'<div class="seatrow'+(st==='nej'?' nej':'')+'" draggable="true" data-sdrag="'+id+'|'+E(e.id)+'" data-sdrop="'+id+'" data-si="'+i+'"><span class="nm">'+E(e.name)+(n>1?' <span class="hint">('+n+' pers.)</span>':'')+(st==='nej'?' <span class="chip bad">Kommer ikke</span>':'')+'</span>'+
      '<button class="btn sm ghost" data-a="seatUp" data-t="'+id+'" data-e="'+E(e.id)+'" aria-label="Flyt op"'+(i===0?' disabled':'')+'>'+ico('up','s')+'</button>'+
      '<button class="btn sm ghost" data-a="seatDown" data-t="'+id+'" data-e="'+E(e.id)+'" aria-label="Flyt ned"'+(i===ppl.length-1?' disabled':'')+'><span style="display:inline-flex;transform:rotate(180deg)">'+ico('up','s')+'</span></button>'+
      '<button class="btn sm ghost" data-a="seatEdit" data-t="'+id+'" data-e="'+E(e.id)+'" aria-label="Ret navn eller flyt">'+ico('edit','s')+'</button>'+
      '<button class="btn sm ghost danger" data-a="seatDel" data-t="'+id+'" data-e="'+E(e.id)+'" aria-label="Fjern '+E(e.name)+' fra bordet">'+ico('x','s')+'</button></div>';
  }).join('');
  if(u<c){
    const q=S.ui.sug&&S.ui.sug.tid===t.id?S.ui.sug.q:'';
    h+='<div style="margin-top:10px"><input id="si-'+id+'" class="in" data-i="seatQ" data-t="'+id+'" data-seatin="1" autocomplete="off" placeholder="Skriv et gæstenavn…" value="'+E(q)+'" aria-label="Tilføj gæst til bord '+E(t.no)+'">'+sugHtml(t,q)+'</div>';
  }else if(over)h+='<p class="hint" style="margin-top:10px;color:var(--bad);font-weight:600">Fjern '+over+(over===1?' gæst':' gæster')+' fra bordet.</p>';
  else h+='<p class="hint" style="margin-top:10px">Bordet er fuldt.</p>';
  return h+'</article>';
}
function suggestions(q){
  const s=q.trim().toLowerCase();if(!s)return[];
  return unplaced().filter(g=>String(g.name||'').toLowerCase().includes(s)||String(g.group||'').toLowerCase().includes(s)).slice(0,8);
}
function sugHtml(t,q){
  if(!q.trim())return'';
  const id=E(t.id),list=suggestions(q);
  return'<div class="sug" role="listbox">'+list.map(g=>{
    const e=effGuest(g,(S.d.rsvp||{})[g.id]),p=partyOf(g);
    return'<button data-a="seatPick" data-t="'+id+'" data-g="'+E(g.id)+'"><span>'+E(g.name)+'</span><span class="hint">'+(g.group?E(g.group)+' · ':'')+(p>1?p+' pers. · ':'')+(e.status==='nej'?'kommer ikke':e.status==='ja'?'kommer':'afventer')+'</span></button>';
  }).join('')+'<button data-a="seatManual" data-t="'+id+'"><span>Tilføj «'+E(q.trim())+'» som eget navn</span></button></div>';
}
I.seatQ=el=>{S.ui.sug={tid:el.dataset.t,q:el.value};render()};

/* ---- placing names ---- */
async function addEntries(tid,list){
  const t=(S.d.tables||{})[tid];if(!t)return false;
  const placed=placedSet();
  list=list.filter(e=>!(e.gid&&placed.has(e.gid)&&!e.again));
  const need=list.reduce((a,e)=>a+e.n,0);
  if(!list.length)return false;
  if(usedOf(t)+need>capOf(t)){toast('Bord '+t.no+' har kun '+(capOf(t)-usedOf(t))+' ledige pladser. Øg antallet af stole, eller vælg et andet bord.');return false}
  await tref(tid).update({ppl:(t.ppl||[]).concat(list.map(e=>({id:rid(),gid:e.gid||null,name:e.name,n:e.n})))});
  S.ui.sug=null;return true;
}
A.seatPick=async el=>{
  const g=(S.d.guests||{})[el.dataset.g];if(!g)return;
  await seatGuest(el.dataset.t,Object.assign({id:el.dataset.g},g));
};
A.seatManual=async el=>{
  const q=(S.ui.sug&&S.ui.sug.q||'').trim();if(!q)return;
  await addEntries(el.dataset.t,splitNames(q).map(nm=>({gid:null,name:nm,n:1})));
};
/* a guest with several people is added one person at a time */
async function seatGuest(tid,g){
  const parts=splitNames(g.name),p=Math.max(partyOf(g),parts.length);
  if(p>1&&parts.length>=p)await addEntries(tid,parts.map((nm,i)=>({gid:g.id,name:nm,n:1,again:i>0})));
  else if(p>1)splitModal(tid,g,p,parts);
  else await addEntries(tid,[{gid:g.id,name:g.name,n:1}]);
}
async function seatEnter(tid){
  const q=(S.ui.sug&&S.ui.sug.tid===tid?S.ui.sug.q:'').trim();if(!q)return;
  const m=suggestions(q)[0];
  if(m)await seatGuest(tid,m);
  else await addEntries(tid,splitNames(q).map(nm=>({gid:null,name:nm,n:1})));
}
document.addEventListener('keydown',e=>{
  const t=e.target;if(!t||!t.dataset||!t.dataset.seatin)return;
  if(e.key==='Enter'){e.preventDefault();go(()=>seatEnter(t.dataset.t))}
  else if(e.key==='Escape'){S.ui.sug=null;render()}
});
function splitModal(tid,g,party,parts){
  parts=parts||[g.name];
  S.M={type:'split',tid,gid:g.id,party,name:g.name};
  modal('<h2>'+E(g.name)+' er '+party+' personer</h2><p class="lead" style="margin:0 0 12px">Skriv navnet på hver person, så de får hver deres plads og kan flyttes enkeltvis.</p><div class="stack">'+
    Array.from({length:party},(_,i)=>'<label class="f">Person '+(i+1)+'<input id="sp-'+i+'" class="in" value="'+E(parts[i]||'')+'" placeholder="Navn på person '+(i+1)+'"></label>').join('')+
    '</div><div class="foot"><button class="btn" data-a="modalClose">Annuller</button><button class="btn primary" data-a="splitGo">Gem navne</button></div>');
}
A.splitGo=async()=>{
  const M=S.M;if(!M||M.type!=='split')return;
  const list=[];
  for(let i=0;i<M.party;i++){
    const v=val('sp-'+i).trim();
    /* a field with "Anna og Peter" becomes two people; "og" is dropped */
    if(v&&splitNames(v).length>1)splitNames(v).forEach(nm=>list.push({gid:M.gid,name:nm,n:1,again:list.length>0}));
    else list.push({gid:M.gid,name:v||(i===0?M.name:M.name+' ('+(i+1)+')'),n:1,again:i>0});
  }
  if(await addEntries(M.tid,list))closeModal();
};
A.splitOne=async()=>{
  const M=S.M;if(!M||M.type!=='split')return;
  if(await addEntries(M.tid,[{gid:M.gid,name:M.name,n:M.party}]))closeModal();
};
A.seatDel=async el=>{
  const t=(S.d.tables||{})[el.dataset.t];if(!t)return;
  await tref(el.dataset.t).update({ppl:(t.ppl||[]).filter(e=>e.id!==el.dataset.e)});
};

/* ---- moving names (drag, arrows, edit) ---- */
async function moveEntry(ft,eid,tt,idx){
  const tb=S.d.tables||{},A0=tb[ft],B0=tb[tt];if(!A0||!B0)return;
  const r=planMove(A0,ft===tt?A0:B0,eid,idx,true);
  if(r.err==='full'){toast('Bord '+B0.no+' har ikke plads til flere. Øg antallet af stole, eller vælg et andet bord.');return}
  if(r.err)return;
  await tref(ft).update({ppl:r.a});
  if(r.b)await tref(tt).update({ppl:r.b});
}
A.seatUp=el=>{const t=(S.d.tables||{})[el.dataset.t];if(!t)return;const i=(t.ppl||[]).findIndex(e=>e.id===el.dataset.e);if(i>0)return moveEntry(el.dataset.t,el.dataset.e,el.dataset.t,i-1)};
A.seatDown=el=>{const t=(S.d.tables||{})[el.dataset.t];if(!t)return;const i=(t.ppl||[]).findIndex(e=>e.id===el.dataset.e);if(i>=0&&i<t.ppl.length-1)return moveEntry(el.dataset.t,el.dataset.e,el.dataset.t,i+2)};

const PAPER_MM={a4:[210,297],a3:[297,420],a2:[420,594],a1:[594,841],a0:[841,1189]};
const pdfStr=s=>String(s==null?'':s).replace(/…/g,'.').replace(/[–—]/g,'-').replace(/[^\x00-\xFF]/g,c=>{const b=c.normalize('NFD').replace(/[\u0300-\u036f]/g,'');return b&&/^[\x00-\xFF]+$/.test(b)?b:'?'});
const comma=n=>String(Math.round(n*100)/100).replace('.',',');

};

/* ---- tiny PDF writer: lines, polygons, circles and Helvetica text (Danish letters via WinAnsi) ---- */
const PT=25.4/72;
let _mc=null;
function textMm(str,pt,bold){
  try{
    _mc=_mc||document.createElement('canvas').getContext('2d');
    _mc.font=(bold?'bold ':'')+'100px Arial, Helvetica, "Liberation Sans", sans-serif';
    return _mc.measureText(str).width/100*pt*PT;
  }catch(e){return String(str).length*pt*PT*0.56}
}
function MiniPdf(wmm,hmm){
  const K=72/25.4,pg=[];let cur=[];
  const f=n=>(Math.round(n*100)/100).toString();
  const P={
    w:wmm,h:hmm,
    fill:(r,g,b)=>cur.push(f(r/255)+' '+f(g/255)+' '+f(b/255)+' rg'),
    stroke:(r,g,b)=>cur.push(f(r/255)+' '+f(g/255)+' '+f(b/255)+' RG'),
    lw:x=>cur.push(f(x*K)+' w'),
    path(pts,op){
      cur.push(pts.map((p,i)=>f(p[0]*K)+' '+f((hmm-p[1])*K)+(i?' l':' m')).join(' ')+' h '+(op==='F'?'f':op==='S'?'S':'B'));
    },
    line(a,b,c,d){cur.push(f(a*K)+' '+f((hmm-b)*K)+' m '+f(c*K)+' '+f((hmm-d)*K)+' l S')},
    rect(x,y,w,h,op){P.path([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],op)},
    circle(x,y,r,op){
      const c=0.5523*r,X=a=>f(a*K),Y=a=>f((hmm-a)*K);
      cur.push(X(x+r)+' '+Y(y)+' m '+X(x+r)+' '+Y(y+c)+' '+X(x+c)+' '+Y(y+r)+' '+X(x)+' '+Y(y+r)+' c '+X(x-c)+' '+Y(y+r)+' '+X(x-r)+' '+Y(y+c)+' '+X(x-r)+' '+Y(y)+' c '+X(x-r)+' '+Y(y-c)+' '+X(x-c)+' '+Y(y-r)+' '+X(x)+' '+Y(y-r)+' c '+X(x+c)+' '+Y(y-r)+' '+X(x+r)+' '+Y(y-c)+' '+X(x+r)+' '+Y(y)+' c h '+(op==='F'?'f':op==='S'?'S':'B'));
    },
    /* angle = degrees clockwise as seen on the page; align left|center|right; mid centres on the line vertically */
    text(str,x,y,o){
      o=o||{};const pt=o.size||10,a=(o.angle||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
      const w=textMm(str,pt,o.bold);
      let sh=o.align==='center'?-w/2:o.align==='right'?-w:0,dn=o.mid?pt*PT*0.35:0;
      const px=x+c*sh-s*dn,py=y+s*sh+c*dn;
      const t=String(str).replace(/[\\()]/g,m=>'\\'+m).replace(/[\r\n]/g,' ');
      cur.push('BT /'+(o.bold?'F2':'F1')+' '+f(pt)+' Tf '+f(c)+' '+f(-s)+' '+f(s)+' '+f(c)+' '+f(px*K)+' '+f((hmm-py)*K)+' Tm ('+t+') Tj ET');
    },
    width:(str,pt,bold)=>textMm(str,pt,bold),
    blob(){
      pg.push(cur.join('\n'));
      const objs=[];const add=s=>{objs.push(s);return objs.length};
      add('<< /Type /Catalog /Pages 2 0 R >>');
      add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
      add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+f(wmm*K)+' '+f(hmm*K)+'] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>');
      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      add('<< /Length '+pg[0].length+' >>\nstream\n'+pg[0]+'\nendstream');
      let out='%PDF-1.4\n',off=[];
      objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
      const x=out.length;
      out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
      const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
      return new Blob([u],{type:'application/pdf'});
    }
  };
  return P;
}
